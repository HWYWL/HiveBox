[package]
name = "deepseek-monitor"
version = "0.1.0"
edition = "2021"
description = "A standard iced program: one DeepSeek account's balance and what it spent today"
license = "GPL-3.0-only"

# A member of the workspace at the root of `pomelo-apps` (`Cargo.toml`), like its siblings: one lock,
# one `cargo test --workspace`, and a `main.rs` of its own for the desktop window.

[dependencies]
# The facade, like any other iced program. No `canvas`: this page is two cards and some numbers.
iced = { version = "0.14", default-features = false, features = ["thread-pool", "x11", "wayland"] }

# The board, and through it the account. The two credentials, the two documents and everything about
# TLS stay behind `DeepSeekBackend`; this page only sees money and counts.
pomelo-hal = { git = "https://github.com/pomelos-on-sale/pomelo-hal.git", rev = "20eaa910f0a05cd68684d6aa868fd78457c51be9" }

# The shared preferences: the theme, the language, and the base font size every measurement here
# comes out of.
pomelo-widgets = { git = "https://github.com/pomelos-on-sale/pomelo-widgets.git", rev = "f499da5cc17ef16ced6e6b1e62286bb020837a0b" }

# The icons: the wallet, the calendar, the key.
pomelo-material-symbols = { git = "https://github.com/pomelos-on-sale/pomelo-material-symbols.git", rev = "7dc390fb1924dc69b375e5ae77806857f798cc58" }

[build-dependencies]
# 烘图标用，只在构建机上跑：把 `assets/app-icons/*.png` 变成 RGB565 + alpha 的静态数组。
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# The board's simulator is what the tests build this page on: `Board::simulated()` is in `pomelo-hal`
# itself, so nothing else is needed.
iced_test = "0.14"

[features]
# On by default, because a project of its own is a desktop program. The board is the other way round.
desktop = ["iced/tiny-skia"]
default = ["desktop"]
