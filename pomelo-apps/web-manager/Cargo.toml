[package]
name = "web-manager"
version = "0.1.0"
edition = "2021"
description = "A standard iced program: the LAN management server switch and its address"
license = "GPL-3.0-only"

# A member of the workspace at the root of this repository (`Cargo.toml`): that is what lets
# `cargo test --workspace` run every app against one lock while each stays its own crate, with its
# own `main.rs` and its own `desktop` feature. Nothing in this graph patches anything, so `cargo run`
# here builds against iced from crates.io, exactly like any other iced program.
#
# That is also why the firmware cannot list this as a *member* — the apps are a project of their own —
# so `app-launcher` and `rust_main` depend on it by path. Patches and features are the root's
# business, and the firmware's root is the one that has them.

[dependencies]
# The facade, like any other iced program. No platform layer and no renderer: `desktop` below picks
# iced's software renderer, and the board's root turns that off and supplies its own.
iced = { version = "0.14", default-features = false, features = ["thread-pool", "x11", "wayland"] }

# The board. The app is handed one by whoever builds it — the launcher shares the one it already has
# with every app it hosts, and `main.rs` builds the desktop simulator — the same shape `settings` and
# `music-player` use. It needs it because the switch is a *conversation* with a server this app does
# not own: `Board::web()` is where `start`, `stop` and `status` live, and the address the page shows
# is read off `Board::wifi()`.
# From GitHub by revision: a sibling repository, and this project builds on its own.
pomelo-hal = { git = "https://github.com/pomelos-on-sale/pomelo-hal.git", rev = "20eaa910f0a05cd68684d6aa868fd78457c51be9" }

# System preferences (language, theme) and the font tiers they carry.
pomelo-widgets = { git = "https://github.com/pomelos-on-sale/pomelo-widgets.git", rev = "f499da5cc17ef16ced6e6b1e62286bb020837a0b" }

# The icons: the state badge on the status card and the foot of the note under the switch. Glyphs
# rather than ASCII text or drawn shapes — the Material Symbols subset the launcher already installs
# for every app it hosts.
pomelo-material-symbols = { git = "https://github.com/pomelos-on-sale/pomelo-material-symbols.git", rev = "7dc390fb1924dc69b375e5ae77806857f798cc58" }

[features]
# On by default, because a project of its own is a desktop program. The board is the other way round:
# `rust_main` and `app-launcher` depend on this crate with `default-features = false`, and the
# platform layer turns `pomelo` on instead — the two are mutually exclusive inside `iced_renderer`,
# so it has to be one or the other.
desktop = ["iced/tiny-skia"]
default = ["desktop"]

[dev-dependencies]
# The widget-tree tester: the real widget tree, no host, no window, no pixels.
iced_test = "0.14"
