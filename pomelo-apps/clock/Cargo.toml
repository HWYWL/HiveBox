[package]
name = "clock"
version = "0.1.0"
edition = "2021"
description = "A clock face, a pomodoro timer and a list of alarms"
license = "GPL-3.0-only"

# A member of the workspace at the root of this directory (`Cargo.toml`): that is what lets
# `cargo test --workspace` run every app against one lock while each stays its own crate, with its own
# `main.rs` and its own `desktop` feature.

[dependencies]
# The facade. `canvas` and `advanced` are here for the dial and the timer ring: both are arcs, and
# iced's widgets draw rectangles — the same two a `canvas::Program` of one's own is behind in the
# settings app. Everything else in this app is built out of the widgets iced ships.
iced = { version = "0.14", default-features = false, features = ["advanced", "canvas", "thread-pool", "x11", "wayland"] }

# The board: the wall clock and the uptime come from here, and neither is this app's to keep. The
# alarms are this app's own, and are kept on the board's filesystem through this same door.
pomelo-hal = { git = "https://github.com/pomelos-on-sale/pomelo-hal.git", rev = "20eaa910f0a05cd68684d6aa868fd78457c51be9" }

# The shared preferences: the theme and the language are the system's, not this app's, and the font
# tier is what every measurement in `style` is derived from.
pomelo-widgets = { git = "https://github.com/pomelos-on-sale/pomelo-widgets.git", rev = "f499da5cc17ef16ced6e6b1e62286bb020837a0b" }

# The icons: the two on the timer's transport, the four steppers of an alarm, and the tab glyphs.
pomelo-material-symbols = { git = "https://github.com/pomelos-on-sale/pomelo-material-symbols.git", rev = "7dc390fb1924dc69b375e5ae77806857f798cc58" }

[features]
# On by default, because a project of its own is a desktop program: iced needs *a* renderer, and this is
# the one that needs no GPU. The board is the other way round — `app-launcher` is the one crate that
# depends on this one, and it does so with `default-features = false`, so on the panel there is no
# renderer in this crate's graph at all and the platform layer is what paints.
desktop = ["iced/tiny-skia"]
default = ["desktop"]

[dev-dependencies]
# The widget-tree tester: the real widget tree, no host, no window, no pixels.
iced_test = "0.14"
