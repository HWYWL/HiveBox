# The applications, as one project.
#
# Each app is its own crate — its own `main.rs`, its own test suite, its own `desktop` feature — and
# this table is what makes them one project: one `Cargo.lock`, `cargo test --workspace` in one
# command, and `cargo run -p <app>` from here.
#
# The three crates the apps share (`pomelo-hal`, `pomelo-widgets`, `pomelo-material-symbols`) come
# from GitHub, pinned by revision in the manifests that need them, because this project builds on
# its own: only the applications are here. The `[patch]` tables below are what makes a *checkout* of
# this repository build the apps against the sibling directories rather than against those revisions —
# so `cargo test --workspace` here tests the code in the tree, while a manifest on its own (and the
# firmware's roots, which have their own tables) builds against what was published.
[workspace]
resolver = "2"

members = [
    # The platform: one crate for the contract across the sandbox boundary, one for the runtime that
    # enforces it, one for the SDK applications are written against, and one for the reader both the
    # release manifest and a package's metadata are parsed with.
    "app-abi",
    "app-host",
    "app-sdk",
    "mini-json",
    "store",
    # The applications that are packages rather than crates in the firmware. Their build target is
    # `wasm32-unknown-unknown`; they are members so that one `cargo test` still covers the whole tree.
    # The pairs below (a `wasm-apps/<id>` and the crate of the same name still in the image) are the
    # migration as it stands: a package is published, then the crate it replaces is taken out — see
    # `tools/build_apps.py`, whose catalogue is the one list of what is published.
    "wasm-apps/calculator",
    "wasm-apps/clock",
    "wasm-apps/cloud-monitor",
    "wasm-apps/games",
    "wasm-apps/nas-monitor",
    "wasm-apps/power-log",
    "wasm-apps/task-viewer",
    "wasm-apps/weather",
    "wasm-apps/wifi-map",
    "task-viewer",
    "app-launcher",
    "cloud-monitor",
    "files",
    "games",
    "music-player",
    "nas-monitor",
    "power-log",
    "settings",
    "terminal",
    "updater",
    "weather",
    "web-manager",
    "wifi-map",
]

[patch."https://github.com/pomelos-on-sale/pomelo-widgets.git"]
pomelo-widgets = { path = "../pomelo-widgets" }

[patch."https://github.com/pomelos-on-sale/pomelo-hal.git"]
pomelo-hal = { path = "../pomelo-hal" }

[patch."https://github.com/pomelos-on-sale/pomelo-material-symbols.git"]
pomelo-material-symbols = { path = "../ui-framework/pomelo-material-symbols" }

