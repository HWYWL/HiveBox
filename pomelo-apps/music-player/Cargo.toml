[package]
name = "music-player"
version = "0.1.0"
edition = "2021"
description = "A standard iced program: the music player, playing through a pomelo-hal board"
license = "GPL-3.0-only"

# A member of the workspace at the root of this repository (`Cargo.toml`): that is what lets
# `cargo test --workspace` run all seven apps against one lock while each stays its own crate, with
# its own `main.rs` and its own `desktop` feature. Nothing in this graph patches anything, so
# `cargo run` here builds against iced from crates.io, exactly like any other iced program.
#
# That is also why the firmware cannot list this as a *member* — the apps are a project of their
# own — so `rust_main` and `firmware/panel-tests` depend on it by path. Patches and features are
# the root's business, and the firmware's root is the one that has them.

[dependencies]
# The facade, like any other iced program. No platform layer and no renderer: `desktop` below picks
# iced's software renderer, and the board's root turns that off and supplies its own.
#
# Both display servers, because which one exists is the machine's business and not the app's (and
# iced `compile_error!`s without at least one of them on unix).
iced = { version = "0.14", default-features = false, features = ["thread-pool", "x11", "wayland"] }
pomelo-widgets = { git = "https://github.com/pomelos-on-sale/pomelo-widgets.git", rev = "f499da5cc17ef16ced6e6b1e62286bb020837a0b" }

# The board it plays through, which the caller injects — the firmware the ESP32-S3 one, this
# project's `main.rs` the desktop simulator. That is a HAL dependency and not a platform-layer one:
# it is the interface, with no hardware behind it. From GitHub by revision: a sibling repository,
# and this project builds on its own.
pomelo-hal = { git = "https://github.com/pomelos-on-sale/pomelo-hal.git", rev = "20eaa910f0a05cd68684d6aa868fd78457c51be9" }
pomelo-material-symbols = { git = "https://github.com/pomelos-on-sale/pomelo-material-symbols.git", rev = "7dc390fb1924dc69b375e5ae77806857f798cc58" }

[features]
# On by default, because a project of its own is a desktop program. The board is the other way
# round: `rust_main`, `app-launcher` and `firmware/panel-tests` depend on this crate with
# `default-features = false`, and the platform layer turns `pomelo` on instead — the two are
# mutually exclusive inside `iced_renderer`, so it has to be one or the other.
desktop = ["iced/tiny-skia"]
default = ["desktop"]

[dev-dependencies]
# The widget-tree tester: the real widget tree, no host, no window, no pixels.
iced_test = "0.14"
