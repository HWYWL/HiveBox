[package]
name = "updater"
version = "0.1.0"
edition = "2021"
description = "A standard iced program: what firmware and glyph table this box runs, and what the repository has instead"
license = "GPL-3.0-only"

# A member of the workspace at the root of `pomelo-apps` (`Cargo.toml`): that is what lets
# `cargo test --workspace` run every app against one lock while each stays its own crate, with its own
# `main.rs` and its own `desktop` feature.

[dependencies]
# The facade. No `canvas`: the page is two cards, a button each and a line under them.
iced = { version = "0.14", default-features = false, features = ["thread-pool", "x11", "wayland"] }

# The board, and through it three things: the network the manifest comes off, the system's own
# description of the image it is running, and the card a glyph table would land on.
#
# From GitHub by revision like its siblings: sibling repositories, and this project builds on its own.
pomelo-hal = { git = "https://github.com/pomelos-on-sale/pomelo-hal.git", rev = "20eaa910f0a05cd68684d6aa868fd78457c51be9" }

# The shared preferences: the theme, the language, and the base font size every measurement here comes
# out of.
pomelo-widgets = { git = "https://github.com/pomelos-on-sale/pomelo-widgets.git", rev = "f499da5cc17ef16ced6e6b1e62286bb020837a0b" }

# The icons: the two rows' glyphs, the download and the check.
pomelo-material-symbols = { git = "https://github.com/pomelos-on-sale/pomelo-material-symbols.git", rev = "7dc390fb1924dc69b375e5ae77806857f798cc58" }

[features]
# On by default, because a project of its own is a desktop program: iced needs *a* renderer, and this is
# the one that needs no GPU. The board is the other way round — `rust_main` and `app-launcher` depend on
# this crate with `default-features = false` and the platform layer turns `pomelo` on instead.
desktop = ["iced/tiny-skia"]
default = ["desktop"]
