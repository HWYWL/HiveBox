[package]
name = "pomelo-hal-esp32"
version = "0.1.0"
edition = "2021"
description = "The ESP32-S3 (Waveshare Touch-AMOLED-2.16) implementation of the pomelo-hal board interfaces, over the `board_hal` C drivers"
license = "GPL-3.0-only"
# Never published: it is only meaningful next to `firmware/components/board_hal/`, whose C
# functions it declares. The interface it implements is the published half (`pomelo-hal`).
publish = false

# A project of its own. It needs no patch table: its only dependency is the interface crate next
# door, which depends on nothing. What it does need is a *place* to be type-checked, because it only
# ever runs inside the firmware image — `cargo check` in this directory is that place.
[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
# `decode` is on for the same reason the audio backend exists: this is the crate that plays a track,
# and an MP3 or FLAC is one of the three formats it plays. Without it the board would still *list*
# those files and then refuse them at the moment of pressing play.
pomelo-hal = { git = "https://github.com/pomelos-on-sale/pomelo-hal.git", rev = "80af97fdcbe15592b28f8fdbf2047308ad406551", features = ["decode"] }

# SSH, in Rust. Replaces the libssh C library the NAS backend used to link: no C SSH code, no mbedTLS
# underneath it, and nothing extra in the image beyond RustCrypto.
#
# The default feature is `mlkem` (a post-quantum key exchange) and `std` would pull it in again by
# name, so both are off: this board talks to one NAS on a LAN, and a key exchange it will never
# negotiate is flash spent on nothing. `ecdsa256` stays because a NAS that offers an ECDSA host key
# and not an ed25519 one would otherwise be a machine this board cannot look at; ed25519, curve25519
# and the ciphers/MACs are always compiled in.
sunset = { version = "0.6", default-features = false, features = ["ecdsa256"] }

[patch."https://github.com/pomelos-on-sale/pomelo-hal.git"]
pomelo-hal = { path = "../../../pomelo-hal" }

