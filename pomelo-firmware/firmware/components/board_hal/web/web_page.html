<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HiveBox">
<title>HiveBox 网页管理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23007aff'/%3E%3Cpath fill='%23fff' fill-rule='evenodd' d='M49 32 40.5 46.7 23.5 46.7 15 32 23.5 17.3 40.5 17.3Z M32 25.6 40 30.2 40 33.8 32 38.4 24 33.8 24 30.2Z'/%3E%3C/svg%3E">
<script>
/* Ahead of the first paint, so that a dark screen never flashes white. The choice is the system's
   unless somebody has made one on this page; `light` is what the stylesheet is written in, so only
   the other one has to be set. */
(function () {
  try {
    var saved = localStorage.getItem("hivebox.theme");
    var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  } catch (error) { /* private mode: the stylesheet's own choice stands */ }
})();
</script>
<style>
/* ---------------------------------------------------------------------------
   One file, no framework. The box serves it out of flash, where it costs nothing at run time: the
   bytes go out of the image as they are and are never copied into RAM. Every string a person reads
   lives in this file too, in `ERRORS` below, because the device answers in codes on purpose.

   The look is the one a phone already has: grouped lists on a tinted background, a segmented control
   at the top, sheets that come up from the bottom, one accent colour. The colours are tokens and only
   the dark set is written out — the light set is the one the rules below are written in.
   --------------------------------------------------------------------------- */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --bg: #f2f2f7;
  --bg-blur: rgba(242,242,247,.78);
  --card: #ffffff;
  --fill: rgba(120,120,128,.12);
  --fill-2: rgba(120,120,128,.22);
  --label: #000000;
  --label-2: rgba(60,60,67,.6);
  --label-3: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.16);
  --tint: #007aff;
  --tint-soft: rgba(0,122,255,.12);
  --green: #34c759;
  --orange: #ff9500;
  --red: #ff3b30;
  --purple: #af52de;
  --teal: #30b0c7;
  --indigo: #5856d6;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 10px 30px rgba(0,0,0,.06);
  --shadow-sheet: 0 -2px 40px rgba(0,0,0,.2);
  --radius: 16px;
  --radius-sm: 11px;
  --ease: cubic-bezier(.32,.72,0,1);
  --blur: saturate(180%) blur(22px);
}
:root[data-theme="dark"] {
  --bg: #000000;
  --bg-blur: rgba(0,0,0,.72);
  --card: #1c1c1e;
  --fill: rgba(120,120,128,.24);
  --fill-2: rgba(120,120,128,.36);
  --label: #ffffff;
  --label-2: rgba(235,235,245,.6);
  --label-3: rgba(235,235,245,.32);
  --sep: rgba(84,84,88,.65);
  --tint: #0a84ff;
  --tint-soft: rgba(10,132,255,.18);
  --green: #30d158;
  --orange: #ff9f0a;
  --red: #ff453a;
  --purple: #bf5af2;
  --teal: #40c8e0;
  --indigo: #5e5ce6;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 30px rgba(0,0,0,.45);
  --shadow-sheet: 0 -2px 40px rgba(0,0,0,.6);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
html { background: var(--bg); }
body {
  font: 400 15px/1.45 var(--font);
  color: var(--label);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "tnum" 1;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: var(--tint); text-decoration: none; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
.ic {
  width: 20px; height: 20px; flex: 0 0 auto; display: block;
  fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round;
}
.ic.sm { width: 15px; height: 15px; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* --- the bar at the top: title, status, segmented control ------------------ */
.bar {
  position: sticky; top: 0; z-index: 30;
  background: var(--bg-blur);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border-bottom: .5px solid var(--sep);
  padding-top: env(safe-area-inset-top);
}
.bar-in { max-width: 720px; margin: 0 auto; padding: 12px 16px 8px; }
.head { display: flex; align-items: center; gap: 12px; }
.mark {
  width: 38px; height: 38px; border-radius: 11px; flex: 0 0 auto;
  background: linear-gradient(160deg, #4ea8ff, var(--tint));
  color: #fff; display: grid; place-items: center;
  box-shadow: 0 4px 12px rgba(0,122,255,.28);
}
.mark .ic { width: 22px; height: 22px; }
.head-txt { min-width: 0; flex: 1; }
.head-title { font-size: 19px; font-weight: 700; letter-spacing: -.4px; }
.head-sub { font-size: 12.5px; color: var(--label-2); display: flex; align-items: center; gap: 5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--label-3); flex: 0 0 auto; }
.dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(52,199,89,.18); }
.dot.off { background: var(--orange); }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: var(--fill); color: var(--label-2);
  transition: transform .2s var(--ease), background .2s;
}
.icon-btn:active { transform: scale(.9); background: var(--fill-2); }

.seg {
  position: relative; display: flex; gap: 2px; margin-top: 12px;
  background: var(--fill); border-radius: var(--radius-sm); padding: 2px;
}
.seg-thumb {
  position: absolute; top: 2px; bottom: 2px; left: 0; border-radius: 9px;
  background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.14), 0 0 0 .5px rgba(0,0,0,.04);
  transition: transform .32s var(--ease), width .32s var(--ease);
}
.seg button {
  position: relative; flex: 1; z-index: 1; padding: 7px 4px; border-radius: 9px;
  font-size: 13.5px; font-weight: 600; color: var(--label-2);
  transition: color .2s;
}
.seg button.on { color: var(--label); }

/* --- cards and grouped lists ---------------------------------------------- */
main { padding-top: 16px; }
.group { margin: 0 0 16px; }
.group-title {
  font-size: 13px; font-weight: 600; color: var(--label-2);
  text-transform: none; padding: 0 4px 7px; letter-spacing: .2px;
}
.card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}
.card + .card { margin-top: 12px; }
.row {
  position: relative; display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; min-height: 60px; width: 100%; text-align: left;
  transition: background .16s;
}
.row + .row::before {
  content: ""; position: absolute; top: 0; left: 60px; right: 0; height: .5px; background: var(--sep);
}
.row.tap:active { background: var(--fill); }
.row-main { flex: 1; min-width: 0; }
.row-name {
  font-size: 15.5px; font-weight: 500; letter-spacing: -.1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row-meta {
  font-size: 12.5px; color: var(--label-2); margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row-val { font-size: 14.5px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.chev { color: var(--label-3); flex: 0 0 auto; }
.tile {
  width: 36px; height: 36px; border-radius: 10px; flex: 0 0 auto;
  display: grid; place-items: center; color: #fff;
  box-shadow: inset 0 -.5px 0 rgba(0,0,0,.08);
}
.tile .ic { width: 20px; height: 20px; }
.t-dir     { background: linear-gradient(160deg, #5ac8fa, #0a84ff); }
.t-image   { background: linear-gradient(160deg, #ffd166, #ff9500); }
.t-video   { background: linear-gradient(160deg, #7d7aff, #5856d6); }
.t-audio   { background: linear-gradient(160deg, #d17bf5, #af52de); }
.t-code    { background: linear-gradient(160deg, #56d0e6, #30b0c7); }
.t-text    { background: linear-gradient(160deg, #b8bfcc, #8e8e93); }
.t-pdf     { background: linear-gradient(160deg, #ff7a6e, #ff3b30); }
.t-archive { background: linear-gradient(160deg, #d6a86b, #a2845e); }
.t-font    { background: linear-gradient(160deg, #7fd48a, #34c759); }
.t-file    { background: linear-gradient(160deg, #b8bfcc, #8e8e93); }

.row-more {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  color: var(--label-3); flex: 0 0 auto;
}
.row-more:active { background: var(--fill); }
.pick {
  width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto;
  border: 1.5px solid var(--label-3); display: grid; place-items: center; color: transparent;
}
.pick.on { background: var(--tint); border-color: var(--tint); color: #fff; }
/* --- buttons, fields, chips ----------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 15px; border-radius: 12px; font-size: 14px; font-weight: 600;
  background: var(--fill); color: var(--label);
  transition: transform .18s var(--ease), opacity .18s, background .18s;
}
.btn:active { transform: scale(.96); opacity: .78; }
.btn.primary { background: var(--tint); color: #fff; box-shadow: 0 2px 10px rgba(0,122,255,.3); }
.btn.tinted { background: var(--tint-soft); color: var(--tint); }
.btn.danger { background: rgba(255,59,48,.12); color: var(--red); }
.btn.plain { background: transparent; color: var(--tint); }
.btn.ghost { background: transparent; color: var(--label-2); }
.btn.sm { padding: 6px 11px; border-radius: 10px; font-size: 13px; }
.btn.wide { flex: 1; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.bar-actions { display: flex; gap: 8px; padding: 0 0 12px; flex-wrap: wrap; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  display: flex; align-items: center; gap: 8px; padding: 9px 13px; border-radius: 13px;
  background: var(--card); color: var(--label); box-shadow: var(--shadow); flex: 0 0 auto;
  transition: transform .18s var(--ease);
}
.chip:active { transform: scale(.97); }
.chip.on { background: var(--tint); color: #fff; box-shadow: 0 4px 14px rgba(0,122,255,.3); }
.chip.on .chip-sub { color: rgba(255,255,255,.8); }
.chip-name { font-size: 14px; font-weight: 600; }
.chip-sub { font-size: 11.5px; color: var(--label-2); }

.field {
  display: flex; align-items: center; gap: 8px; background: var(--fill);
  border-radius: var(--radius-sm); padding: 10px 12px;
}
.field input {
  flex: 1; min-width: 0; border: 0; background: none; outline: none;
  font-size: 15.5px; color: var(--label);
}
.field input::placeholder { color: var(--label-3); }
input[type="search"]::-webkit-search-cancel-button { display: none; }

/* --- files ---------------------------------------------------------------- */
.pathbar { display: flex; align-items: center; gap: 8px; padding: 0 2px 12px; }
.crumbs {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px;
  overflow-x: auto; scrollbar-width: none; font-size: 14px;
}
.crumbs::-webkit-scrollbar { display: none; }
.crumb { color: var(--tint); font-weight: 500; padding: 3px 4px; border-radius: 7px; white-space: nowrap; }
.crumb:active { background: var(--tint-soft); }
.crumb.last { color: var(--label-2); font-weight: 600; pointer-events: none; }
.crumb-sep { color: var(--label-3); flex: 0 0 auto; }
.tools { display: flex; align-items: center; gap: 8px; padding: 0 0 10px; }
.tools .field { flex: 1; }

.list { min-height: 80px; }
.sel-on .row-more { display: none; }
.sel-on .row { padding-left: 10px; }
.empty { padding: 40px 20px; text-align: center; color: var(--label-2); }
.empty .ic { width: 42px; height: 42px; margin: 0 auto 12px; color: var(--label-3); }
.empty-title { font-size: 15.5px; font-weight: 600; color: var(--label); margin-bottom: 4px; }
.empty-note { font-size: 13px; }

.storage { padding: 12px 14px 14px; }
.storage-head { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--label-2); margin-bottom: 7px; }
.meter { height: 7px; border-radius: 4px; background: var(--fill); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; background: var(--tint); transition: width .5s var(--ease); }
.meter i.warn { background: var(--orange); }
.meter i.full { background: var(--red); }
.meter.lg { height: 10px; border-radius: 6px; }

.sk { padding: 14px; display: flex; gap: 12px; align-items: center; }
.sk i, .sk b { display: block; background: linear-gradient(90deg, var(--fill), var(--fill-2), var(--fill));
  background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px; }
.sk i { width: 36px; height: 36px; flex: 0 0 auto; }
.sk b { height: 11px; margin: 5px 0; }
.sk .l1 { width: 55%; } .sk .l2 { width: 30%; height: 9px; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* --- selection bar, uploader, drop target --------------------------------- */
.selbar {
  position: fixed; z-index: 40; left: 12px; right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom));
  max-width: 696px; margin: 0 auto;
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  background: var(--bg-blur); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border-radius: 15px; box-shadow: var(--shadow-sheet), 0 0 0 .5px var(--sep);
  animation: rise .3s var(--ease);
}
.selbar-count { flex: 1; font-size: 13.5px; font-weight: 600; padding-left: 6px; }

.uploader {
  position: fixed; z-index: 41; right: 12px; width: min(370px, calc(100vw - 24px));
  bottom: calc(12px + env(safe-area-inset-bottom));
  background: var(--bg-blur); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border-radius: 15px; box-shadow: var(--shadow-sheet), 0 0 0 .5px var(--sep);
  overflow: hidden; animation: rise .34s var(--ease);
}
.up-head { display: flex; align-items: center; gap: 8px; padding: 11px 12px; }
.up-head .t { flex: 1; font-size: 13.5px; font-weight: 700; }
.up-list { max-height: 44vh; overflow-y: auto; }
.up-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
.up-item + .up-item { border-top: .5px solid var(--sep); }
.up-info { flex: 1; min-width: 0; }
.up-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up-meta { font-size: 11.5px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.up-bar { height: 3px; border-radius: 2px; background: var(--fill); margin-top: 5px; overflow: hidden; }
.up-bar i { display: block; height: 100%; background: var(--tint); width: 0; transition: width .25s linear; }
.up-item.done .up-bar i { background: var(--green); }
.up-item.error .up-bar i { background: var(--red); }
.up-item.skip .up-bar i { background: var(--label-3); }
.up-x { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--label-3); flex: 0 0 auto; }
.up-x:active { background: var(--fill); }
.up-foot { display: flex; gap: 8px; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); border-top: .5px solid var(--sep); }

.dropzone {
  position: fixed; inset: 0; z-index: 60; display: none;
  place-items: center; background: var(--bg-blur);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
}
.dropzone.on { display: grid; }
.dropzone-in {
  border: 2px dashed var(--tint); border-radius: 24px; padding: 40px 34px; text-align: center;
  background: var(--tint-soft); color: var(--tint); margin: 20px; max-width: 420px;
}
.dropzone-in .ic { width: 46px; height: 46px; margin: 0 auto 12px; }
.dropzone-in b { display: block; font-size: 17px; margin-bottom: 4px; }
.dropzone-in span { font-size: 13px; color: var(--label-2); word-break: break-all; }

/* --- wifi and system ------------------------------------------------------ */
.sig { display: flex; align-items: flex-end; gap: 2px; height: 16px; flex: 0 0 auto; }
.sig i { width: 3.5px; border-radius: 2px; background: var(--label-3); }
.sig i:nth-child(1) { height: 5px; } .sig i:nth-child(2) { height: 8px; }
.sig i:nth-child(3) { height: 12px; } .sig i:nth-child(4) { height: 16px; }
.sig.s1 i:nth-child(-n+1), .sig.s2 i:nth-child(-n+2),
.sig.s3 i:nth-child(-n+3), .sig.s4 i:nth-child(-n+4) { background: var(--green); }
.sig.s1 i:nth-child(-n+1) { background: var(--orange); }
.sig.on-tint i { background: rgba(255,255,255,.35); }
.sig.on-tint.s1 i:nth-child(-n+1), .sig.on-tint.s2 i:nth-child(-n+2),
.sig.on-tint.s3 i:nth-child(-n+3), .sig.on-tint.s4 i:nth-child(-n+4) { background: #fff; }

.radar {
  width: 60px; height: 60px; border-radius: 50%; margin: 6px auto 10px;
  border: 2px solid var(--tint-soft); position: relative;
}
.radar::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid var(--tint); border-top-color: transparent; border-right-color: transparent;
  animation: spin 1.1s linear infinite;
}

.hero { padding: 18px; display: flex; align-items: center; gap: 14px; }
.hero .tile { width: 52px; height: 52px; border-radius: 15px; }
.hero .tile .ic { width: 28px; height: 28px; }
.hero-name { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
.hero-sub { font-size: 12.5px; color: var(--label-2); margin-top: 2px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; font-size: 14px; }
.kv + .kv { border-top: .5px solid var(--sep); }
.kv .k { color: var(--label-2); }
.kv .v { text-align: right; font-variant-numeric: tabular-nums; word-break: break-all; }
.kv .v.mono { font-family: var(--mono); font-size: 12.5px; }

.battery { padding: 16px 14px; }
.bat-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.bat-num { font-size: 30px; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.bat-tag { font-size: 13px; color: var(--label-2); }
.bat-tag.chg { color: var(--green); font-weight: 600; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
.stat-k { font-size: 12.5px; color: var(--label-2); display: flex; align-items: center; gap: 5px; }
.stat-v { font-size: 21px; font-weight: 700; letter-spacing: -.5px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat-n { font-size: 11.5px; color: var(--label-3); margin-top: 2px; }

/* --- sheets, dialogs and toasts ------------------------------------------- */
dialog {
  border: 0; padding: 0; background: transparent; color: var(--label);
  max-width: none; max-height: none;
}
dialog::backdrop { background: rgba(0,0,0,.34); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
.sheet {
  margin: auto auto 0; width: 100%; padding: 0;
}
.sheet-in {
  background: var(--card); border-radius: 22px 22px 0 0;
  padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
  box-shadow: var(--shadow-sheet); animation: rise .34s var(--ease);
  max-height: 88vh; overflow-y: auto;
}
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--fill-2); margin: 2px auto 12px; }
.sheet-title { font-size: 17px; font-weight: 700; text-align: center; letter-spacing: -.3px; }
.sheet-note { font-size: 13px; color: var(--label-2); text-align: center; margin-top: 5px; word-break: break-all; }
.sheet-body { margin-top: 14px; }
.sheet-actions { display: flex; gap: 10px; margin-top: 16px; }
.sheet-actions .btn { padding: 12px; border-radius: 13px; font-size: 15px; }
.acts { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.act {
  display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 13px;
  background: var(--fill); font-size: 15.5px; font-weight: 500; text-align: left;
  transition: transform .18s var(--ease);
}
.act:active { transform: scale(.98); }
.act.danger { color: var(--red); }
.act .ic { color: var(--label-2); }
.act.danger .ic { color: var(--red); }
.act-desc { font-size: 12px; color: var(--label-2); font-weight: 400; margin-top: 2px; }
.remember { display: flex; align-items: center; gap: 10px; padding: 12px 4px 0; font-size: 13.5px; color: var(--label-2); }
.switch {
  width: 46px; height: 28px; border-radius: 15px; background: var(--fill-2); position: relative;
  flex: 0 0 auto; transition: background .25s var(--ease);
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .25s var(--ease);
}
.switch.on { background: var(--green); }
.switch.on::after { transform: translateX(18px); }

dialog.full { margin: auto; width: 100%; }
.pv {
  background: var(--card); display: flex; flex-direction: column;
  height: 100dvh; animation: rise .3s var(--ease);
}
.pv-head {
  display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
  border-bottom: .5px solid var(--sep);
}
.pv-title { flex: 1; min-width: 0; }
.pv-title b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pv-title span { font-size: 12px; color: var(--label-2); }
.pv-body { flex: 1; overflow: auto; display: grid; place-items: center; background: var(--bg); }
.pv-body.pre { display: block; padding: 0; }
.pv-body img { max-width: 100%; max-height: 100%; object-fit: contain; }
.pv-body img.zoom { max-width: none; max-height: none; width: 200%; cursor: zoom-out; }
.pv-body pre {
  margin: 0; padding: 14px; font: 12.5px/1.6 var(--mono); color: var(--label);
  white-space: pre; tab-size: 4; min-height: 100%;
}
.pv-body pre.wrap { white-space: pre-wrap; word-break: break-word; }
.pv-body audio, .pv-body video { max-width: 100%; max-height: 100%; }
.pv-body iframe { width: 100%; height: 100%; border: 0; background: #fff; }
.pv-note { font-size: 12.5px; color: var(--label-2); text-align: center; }
.pv-void { padding: 30px; text-align: center; color: var(--label-2); }
.pv-void .ic { width: 46px; height: 46px; margin: 0 auto 12px; color: var(--label-3); }
.pv-foot { display: flex; gap: 8px; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); border-top: .5px solid var(--sep); }

.toasts {
  position: fixed; z-index: 90; left: 0; right: 0;
  bottom: calc(20px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: 9px; max-width: min(420px, calc(100vw - 32px));
  padding: 11px 16px; border-radius: 26px; font-size: 14px; font-weight: 500;
  background: var(--bg-blur); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: var(--shadow-sheet), 0 0 0 .5px var(--sep);
  animation: pop .3s var(--ease);
}
.toast .ic { color: var(--tint); }
.toast.good .ic { color: var(--green); }
.toast.bad .ic { color: var(--red); }
.toast.leaving { animation: popout .25s var(--ease) forwards; }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
@keyframes pop { from { transform: scale(.94) translateY(8px); opacity: 0; } }
@keyframes popout { to { transform: scale(.96); opacity: 0; } }

@media (min-width: 700px) {
  .sheet { margin: auto; width: min(420px, 100%); }
  .sheet-in { border-radius: 20px; padding-bottom: 16px; }
  dialog.full { width: min(960px, 92vw); }
  .pv { height: min(88vh, 900px); border-radius: 18px; overflow: hidden; }
  .pv-head { padding-top: 10px; }
  .pv-foot { padding-bottom: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>

<header class="bar">
  <div class="bar-in">
    <div class="head">
      <div class="mark"><svg class="ic"><use href="#i-box"/></svg></div>
      <div class="head-txt">
        <div class="head-title">HiveBox</div>
        <div class="head-sub"><span class="dot" id="statDot"></span><span id="statText">正在读取设备状态…</span></div>
      </div>

</header>

<main class="wrap">
  <section id="view-files">

    <div class="pathbar">
      <div class="crumbs" id="crumbs"></div>
      <button class="icon-btn" id="refreshBtn" aria-label="刷新"><svg class="ic sm"><use href="#i-refresh"/></svg></button>
    </div>
    <div class="tools">
      <label class="field">
        <svg class="ic sm"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="搜索这个文件夹里的文件" autocomplete="off" spellcheck="false">
      </label>
      <button class="icon-btn" id="sortBtn" aria-label="排序"><svg class="ic sm"><use href="#i-sort"/></svg></button>
    </div>
    <div class="bar-actions">
      <button class="btn primary" id="upBtn"><svg class="ic sm"><use href="#i-upload"/></svg>上传文件</button>
      <button class="btn tinted" id="upDirBtn"><svg class="ic sm"><use href="#i-folder-plus"/></svg>上传文件夹</button>
      <button class="btn tinted" id="mkdirBtn"><svg class="ic sm"><use href="#i-plus"/></svg>新建文件夹</button>
      <button class="btn" id="selectBtn"><svg class="ic sm"><use href="#i-check"/></svg>选择</button>
    </div>
    <div class="card"><div class="list" id="list"></div></div>
    <div class="card storage" id="storage" hidden></div>
  </section>

  <section id="view-wifi" hidden>
    <div class="group">

        <button class="btn tinted" id="scanBtn"><svg class="ic sm"><use href="#i-refresh"/></svg>扫描附近的网络</button>
      </div>
    </div>
  </section>

  <section id="view-system" hidden>
    <div class="card hero" id="hero"></div>
    <div class="group" style="margin-top:16px"><div class="card" id="sysInfo"></div></div>
    <div class="group">
      <div class="group-title">存储</div>
      <div class="card" id="sysStorage"></div>
    </div>
    <div class="bar-actions">
      <button class="btn" id="sysRefresh"><svg class="ic sm"><use href="#i-refresh"/></svg>刷新</button>
      <button class="btn danger" id="rebootBtn"><svg class="ic sm"><use href="#i-power"/></svg>重启设备</button>

</main>

<!-- One sheet per shape of question, so a question is markup that already exists rather than markup that
     is built and thrown away. `method="dialog"` is what makes Esc and the return key mean "cancel" and
     "yes" without a line of code. -->
<dialog id="dlgPrompt" class="sheet">
  <form method="dialog" class="sheet-in">
    <div class="grab"></div>
    <h3 class="sheet-title" id="pTitle">标题</h3>
    <p class="sheet-note" id="pNote" hidden></p>
    <div class="sheet-body">
      <label class="field">
        <input id="pInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">

      </label>
    </div>

      <button type="button" class="btn wide" id="pCancel">取消</button>

</dialog>

<dialog id="dlgConfirm" class="sheet">
  <form method="dialog" class="sheet-in">
    <div class="grab"></div>
    <h3 class="sheet-title" id="cTitle">确认</h3>
    <p class="sheet-note" id="cNote" hidden></p>
    <div class="remember" id="cRemember" hidden>
      <span class="switch" id="cSwitch"></span><span id="cRememberText"></span>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn wide" id="cCancel">取消</button>
      <button type="submit" class="btn wide" id="cOk" value="ok">好</button>

</dialog>

<dialog id="dlgActions" class="sheet">

    <div class="grab"></div>
    <h3 class="sheet-title" id="aTitle">选择操作</h3>
    <p class="sheet-note" id="aNote" hidden></p>
    <div class="acts" id="aList"></div>
    <div class="remember" id="aRemember" hidden>
      <span class="switch" id="aSwitch"></span><span id="aRememberText"></span>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn wide" id="aCancel">取消</button>

<dialog id="dlgPreview" class="full">

    <div class="pv-head">
      <button class="icon-btn" id="pvBack" aria-label="关闭"><svg class="ic sm"><use href="#i-back"/></svg></button>

      <button class="icon-btn" id="pvClose" aria-label="关闭"><svg class="ic sm"><use href="#i-x"/></svg></button>

    <div class="pv-body" id="pvBody"></div>

      <button class="btn wide danger" id="pvDelete"><svg class="ic sm"><use href="#i-trash"/></svg>删除</button>
    </div>
  </div>
</dialog>

/* ---------------------------------------------------------------------------

   `no_storage`, `scan_failed` — on purpose, so that the wording of an error can be changed here,
   in a file, without a firmware build. A code that is not in the table is shown as it came rather
   than swallowed: an answer nobody expected is worth seeing.
   --------------------------------------------------------------------------- */

  busy: "设备忙，等一下再试",

const RESET_REASONS = {
  power_on: "上电启动", external: "外部复位", software: "软件重启", panic: "程序异常",
  interrupt_watchdog: "中断看门狗", task_watchdog: "任务看门狗", watchdog: "看门狗",
  deep_sleep: "深睡唤醒", brownout: "供电跌落", sdio: "SDIO", unknown: "未知"
};
const WIFI_STATE = {
  connected: "已连接", connecting: "正在连接…", scanning: "正在扫描…", disconnected: "未连接"
};
const SCAN_STATE = { idle: "还没有扫描过", scanning: "正在扫描…", done: "", error: "扫描失败" };

const $ = (id) => document.getElementById(id);
const KB = 1024, MB = KB * 1024, GB = MB * 1024;

const state = {
  view: "files",
  path: "/internal",
  entries: [],
  shown: [],
  roots: ["/internal"],
  volumes: [],
  info: null,            // the last /api/files answer: mount, filesystem, total, free, more
  system: null,
  wifi: null,
  scan: null,
  query: "",
  sort: { key: "name", dir: 1 },
  select: false,
