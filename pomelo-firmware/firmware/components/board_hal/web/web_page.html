/* --- the small things ----------------------------------------------------- */
function esc(text) {
  return String(text == null ? "" : text).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fmtSize(bytes) {
  if (bytes == null || isNaN(bytes)) return "—";
  if (bytes < KB) return bytes + " B";
  const units = ["KB", "MB", "GB", "TB"];
  let value = bytes / KB, unit = 0;
  while (value >= KB && unit < units.length - 1) { value /= KB; unit++; }
  return (value < 10 ? value.toFixed(1) : Math.round(value)) + " " + units[unit];
}

function fmtSpeed(bytesPerSecond) {
  return bytesPerSecond > 0 ? fmtSize(Math.round(bytesPerSecond)) + "/s" : "";
}

function fmtUptime(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60), rest = s % 60;
  if (d) return d + " 天 " + h + " 小时";
  if (h) return h + " 小时 " + m + " 分";
  if (m) return m + " 分 " + rest + " 秒";
  return rest + " 秒";
}

function baseName(path) {
  const parts = String(path).split("/").filter(Boolean);
  return parts.length ? parts[parts.length - 1] : "/";
}

function parentOf(path) {
  const cut = String(path).replace(/\/+$/, "").lastIndexOf("/");
  return cut <= 0 ? "/" : path.slice(0, cut);
}

function joinPath(directory, name) {
  return (directory === "/" ? "" : directory.replace(/\/+$/, "")) + "/" + name;
}

function toast(message, kind) {
  const box = $("toasts");
  const node = document.createElement("div");
  node.className = "toast " + (kind || "");
  const icon = kind === "bad" ? "i-alert" : kind === "good" ? "i-check" : "i-info";
  node.innerHTML = '<svg class="ic sm"><use href="#' + icon + '"/></svg><span>' + esc(message) + "</span>";
  box.appendChild(node);
  while (box.children.length > 3) box.removeChild(box.firstChild);
  setTimeout(() => {
    node.classList.add("leaving");
    setTimeout(() => node.remove(), 260);
  }, kind === "bad" ? 4600 : 2800);
}

/* A request that never arrives is not an error the box reported to anybody, so it is worded like one:
   the page says it cannot reach the box, and the caller decides whether that is worth saying out loud. */
async function api(endpoint, params, method) {
  const query = params ? "?" + new URLSearchParams(params).toString() : "";
  let response;
  try {
    response = await fetch(endpoint + query, { method: method || "GET", cache: "no-store" });
  } catch (error) {
    const offline = new Error(ERRORS.network);
    offline.offline = true;
    throw offline;
  }
  let data = {};
  try { data = await response.json(); } catch (error) { /* see the note in board_web.c: the box always answers JSON */ }
  if (!response.ok || data.error) {
    const failure = new Error(ERRORS[data.error] || "设备返回了 " + (data.error || response.status));
    failure.code = data.error || "http_" + response.status;
    throw failure;
  }
  return data;
}

/* --- what a file is ------------------------------------------------------- */
const EXT_KIND = {
  image: ["png", "jpg", "jpeg", "gif", "webp", "bmp", "svg", "ico", "heic", "heif", "avif", "tiff"],
  video: ["mp4", "webm", "mov", "m4v", "mkv", "avi", "3gp", "ts"],
  audio: ["mp3", "wav", "flac", "m4a", "aac", "ogg", "opus", "amr", "wma"],
  code: ["js", "mjs", "ts", "tsx", "jsx", "rs", "c", "h", "cpp", "hpp", "cc", "py", "sh", "ps1",
         "json", "xml", "html", "htm", "css", "scss", "toml", "yaml", "yml", "ini", "conf", "cfg",
         "lua", "go", "java", "kt", "swift", "sql", "vue", "svelte", "gradle", "cmake"],
  text: ["txt", "log", "md", "markdown", "csv", "tsv", "text", "srt", "vtt", "nfo"],
  pdf: ["pdf"],
  archive: ["zip", "rar", "7z", "tar", "gz", "bz2", "xz", "tgz", "zst"],
  font: ["ttf", "otf", "woff", "woff2"],
  other: ["bin", "elf", "img", "hex", "dat", "db", "bak"]
};
const KIND_TILE = {
  dir: "t-dir", image: "t-image", video: "t-video", audio: "t-audio", code: "t-code",
  text: "t-text", pdf: "t-pdf", archive: "t-archive", font: "t-font", other: "t-file"
};
const KIND_ICON = {
  dir: "i-folder", image: "i-image", video: "i-video", audio: "i-music", code: "i-code",
  text: "i-file", pdf: "i-file", archive: "i-archive", font: "i-font", other: "i-file"
};
const KIND_LABEL = {
  dir: "文件夹", image: "图片", video: "视频", audio: "音频", code: "代码", text: "文本",
  pdf: "PDF 文档", archive: "压缩包", font: "字体", other: "文件"
};

function extensionOf(name) {
  const dot = name.lastIndexOf(".");
  return dot > 0 ? name.slice(dot + 1).toLowerCase() : "";
}

function kindOf(name, isDir) {
  if (isDir) return "dir";
  const ext = extensionOf(name);
  for (const kind in EXT_KIND) {
    if (EXT_KIND[kind].indexOf(ext) >= 0) return kind;
  }
  return "other";
}

function metaText(entry, kind) {
  if (entry.dir) return "文件夹";
  const ext = extensionOf(entry.name);
  return fmtSize(entry.size) + (ext ? " · " + ext.toUpperCase() + " " + KIND_LABEL[kind] : " · " + KIND_LABEL[kind]);
}

/* --- the file list -------------------------------------------------------- */
function sortedShown() {
  const needle = state.query.trim().toLowerCase();
  const list = state.entries.filter((e) => !needle || e.name.toLowerCase().indexOf(needle) >= 0);
  const { key, dir } = state.sort;
  const byName = (a, b) => a.name.localeCompare(b.name, "zh", { numeric: true, sensitivity: "base" });
  return list.sort((a, b) => {
    if (a.dir !== b.dir) return a.dir ? -1 : 1;   /* a folder is a place, and places come first */
    let order = 0;
    if (key === "size") order = a.size - b.size || byName(a, b);
    else if (key === "kind") order = KIND_LABEL[kindOf(a.name, a.dir)].localeCompare(KIND_LABEL[kindOf(b.name, b.dir)]) || byName(a, b);
    else order = byName(a, b);
    return order * dir;
  });
}

function rowHtml(entry, index) {
  const kind = kindOf(entry.name, entry.dir);
  const on = state.picked.has(entry.name);
  const lead = state.select
    ? '<span class="pick ' + (on ? "on" : "") + '"><svg class="ic sm"><use href="#i-check"/></svg></span>'
    : '<span class="tile ' + KIND_TILE[kind] + '"><svg class="ic"><use href="#' + KIND_ICON[kind] + '"/></svg></span>';
  return '<div class="row tap" data-i="' + index + '">' + lead +
    '<div class="row-main"><div class="row-name">' + esc(entry.name) + "</div>" +
    '<div class="row-meta">' + esc(metaText(entry, kind)) + "</div></div>" +
    (entry.dir ? '<svg class="ic sm chev"><use href="#i-chev"/></svg>' : "") +
    '<button class="row-more" data-more="' + index + '" aria-label="更多操作"><svg class="ic sm"><use href="#i-dots"/></svg></button>' +
    "</div>";
}

function skeletonHtml() {
  let html = "";
  for (let i = 0; i < 4; i++) {
    html += '<div class="sk"><i></i><div style="flex:1"><b class="l1"></b><b class="l2"></b></div></div>';
  }
  return html;
}

function renderList() {
  const box = $("list");
  box.classList.toggle("sel-on", state.select);
  if (state.loading) { box.innerHTML = skeletonHtml(); return; }

  state.shown = sortedShown();
  if (!state.entries.length) {
    box.innerHTML = '<div class="empty"><svg class="ic"><use href="#i-folder"/></svg>' +
      '<div class="empty-title">这个文件夹是空的</div>' +
      '<div class="empty-note">把文件拖进来，或者点上面的「上传文件」</div></div>';
    return;
  }
  if (!state.shown.length) {
    box.innerHTML = '<div class="empty"><svg class="ic"><use href="#i-search"/></svg>' +
      '<div class="empty-title">没有找到「' + esc(state.query) + '」</div>' +
      '<div class="empty-note">换个关键词试试</div></div>';
    return;
  }
  box.innerHTML = state.shown.map(rowHtml).join("");
}

function renderCrumbs() {
  const parts = state.path.split("/").filter(Boolean);
  let walked = "", html = "";
  parts.forEach((part, index) => {
    walked += "/" + part;
    if (index) html += '<svg class="ic sm crumb-sep"><use href="#i-chev"/></svg>';
    html += '<button class="crumb ' + (index === parts.length - 1 ? "last" : "") +
            '" data-go="' + esc(walked) + '">' + esc(part) + "</button>";
  });
  $("crumbs").innerHTML = html || '<button class="crumb last">/</button>';
}

function renderVolumes() {
  const list = state.volumes.length
    ? state.volumes
    : state.roots.map((mount) => ({ mount: mount, total: 0, free: 0 }));
  $("volumes").innerHTML = list.map((volume) => {
    const here = state.path === volume.mount || state.path.indexOf(volume.mount + "/") === 0;
    const sub = volume.total ? fmtSize(volume.free) + " 可用" : "";
    return '<button class="chip ' + (here ? "on" : "") + '" data-go="' + esc(volume.mount) + '">' +
      '<svg class="ic sm"><use href="#i-disk"/></svg>' +
      '<span class="chip-txt"><span class="chip-name">' + esc(baseName(volume.mount)) + "</span>" +
      '<span class="chip-sub">' + esc(sub) + "</span></span></button>";
  }).join("");
}

function renderStorage() {
  const box = $("storage");
  const info = state.info;
  if (!info || !info.total) { box.hidden = true; return; }
  const used = Math.max(0, info.total - info.free);
  const percent = Math.min(100, (used / info.total) * 100);
  const level = percent > 92 ? "full" : percent > 75 ? "warn" : "";
  box.hidden = false;
  box.innerHTML =
    '<div class="storage-head"><span>' + esc(baseName(info.mount) + " · " + (info.filesystem || "")) + "</span>" +
    "<span>" + fmtSize(info.free) + " 可用，共 " + fmtSize(info.total) + "</span></div>" +
    '<div class="meter lg"><i class="' + level + '" style="width:' + percent.toFixed(1) + '%"></i></div>' +
    (info.more ? '<div class="row-meta" style="margin-top:8px">文件太多，只列出了前面的 200 项</div>' : "");
}

/* --- loading, and moving around ------------------------------------------- */
async function loadFiles(path) {
  if (path) state.path = path;
  state.loading = true;
  state.picked.clear();
  renderList();
  try {
    const info = await api("/api/files", { path: state.path });
    state.info = info;
    state.path = info.path;
    state.entries = info.entries || [];
    state.roots = info.roots || state.roots;
    if (!state.volumes.length) renderVolumes();
  } catch (error) {
    state.entries = [];
    state.info = null;
    $("list").classList.remove("sel-on");
    $("list").innerHTML = '<div class="empty"><svg class="ic"><use href="#i-alert"/></svg>' +
      '<div class="empty-title">' + esc(error.message) + "</div>" +
      '<div class="empty-note">下拉或点刷新再试一次</div></div>';
    renderStorage();
    if (!error.offline) toast(error.message, "bad");
    state.loading = false;
    syncStatus();
    return;
  }
  state.loading = false;
  state.query = $("search").value.trim();
  renderCrumbs();
  renderVolumes();
  renderList();
  renderStorage();
  syncSelectionBar();
  if (state.view === "files") window.scrollTo({ top: 0, behavior: "smooth" });
}

function go(path) {
  if (path === state.path) { loadFiles(); return; }
  exitSelect();
  state.query = "";
  $("search").value = "";
  loadFiles(path);
}

/* --- selection ------------------------------------------------------------ */
function syncSelectionBar() {
  const bar = $("selbar");
  const on = state.picked.size > 0;
  $("selCount").textContent = on ? "已选择 " + state.picked.size + " 项" : "选择要处理的文件";
  $("selDownload").disabled = !on;
  $("selDelete").disabled = !on;
  $("selbar").hidden = !state.select;
  $("selectBtn").classList.toggle("primary", state.select);
}

function enterSelect() {
  state.select = true;
  state.picked.clear();
  $("selectBtn").innerHTML = '<svg class="ic sm"><use href="#i-x"/></svg>取消';
  renderList();
  syncSelectionBar();
}

function exitSelect() {
  state.select = false;
  state.picked.clear();
  $("selectBtn").innerHTML = '<svg class="ic sm"><use href="#i-check"/></svg>选择';
  renderList();
  syncSelectionBar();
}

function togglePick(entry) {
  if (state.picked.has(entry.name)) state.picked.delete(entry.name);
  else state.picked.add(entry.name);
  renderList();
  syncSelectionBar();
}

/* --- one file at a time --------------------------------------------------- */
function download(name) {
  const link = document.createElement("a");
  link.href = "/api/download?" + new URLSearchParams({ path: joinPath(state.path, name) }).toString();
  link.rel = "noopener";
  document.body.appendChild(link);
  link.click();
  link.remove();
}

async function removeOne(name) {
  const full = joinPath(state.path, name);
  try {
    await api("/api/delete", { path: full }, "POST");
    return true;
  } catch (error) {
    toast(error.message, "bad");
    return false;
  }
}

async function makeFolder() {
  const name = await askText({
    title: "新建文件夹",
    note: "在 " + state.path + " 里",
    placeholder: "文件夹名称",
    ok: "创建"
  });
  if (!name) return;
  try {
    await api("/api/mkdir", { path: state.path, name: name }, "POST");
    toast("已创建 " + name, "good");
    loadFiles();
  } catch (error) {
    toast(error.message, "bad");
  }
}

async function renameOne(name) {
  const next = await askText({
    title: "重命名",
    note: name,
    value: name,
    ok: "保存"
  });
  if (!next || next === name) return;
  try {
    await api("/api/rename", { path: joinPath(state.path, name), name: next }, "POST");
    toast("已重命名为 " + next, "good");
    loadFiles();
  } catch (error) {
    toast(error.message, "bad");
  }
}

async function deleteOne(name, isDir) {
  const sure = await confirmSheet({
    title: "删除" + (isDir ? "文件夹" : "文件"),
    note: name,
    hint: isDir ? "里面的内容会一起删除。" : "删除后无法恢复。",
    ok: "删除",
    danger: true
  });
  if (!sure) return;
  if (await removeOne(name)) {
    toast("已删除 " + name, "good");
    loadFiles();
  }
}

/* The row's own menu, so that a long press is not the only way to find these. */
function rowMenu(entry) {
  const index = state.shown.indexOf(entry);
  actionSheet({
    title: entry.name,
    note: entry.dir ? "文件夹" : fmtSize(entry.size),
    items: [
      entry.dir ? { label: "打开", value: "open", icon: "i-folder" }
                 : { label: "预览", value: "preview", icon: "i-eye" },
      { label: "下载", value: "download", icon: "i-download" },
      { label: "重命名", value: "rename", icon: "i-pencil" },
      { label: "删除", value: "delete", icon: "i-trash", danger: true }
    ]
  }).then((answer) => {
    if (state.shown[index] !== entry) return;   /* the list moved under us: the menu is about a memory */
    const value = answer && answer.value;
    if (value === "open") go(joinPath(state.path, entry.name));
    else if (value === "preview") preview(entry);
    else if (value === "download") download(entry.name);
    else if (value === "rename") renameOne(entry.name);
    else if (value === "delete") deleteOne(entry.name, entry.dir);
  });
}

async function deletePicked() {
  const names = state.shown.filter((e) => state.picked.has(e.name));
  if (!names.length) return;
  const sure = await confirmSheet({
    title: "删除 " + names.length + " 项",
    note: names.slice(0, 3).map((e) => e.name).join("、") + (names.length > 3 ? " 等" : ""),
    hint: "删除后无法恢复。",
    ok: "删除",
    danger: true
  });
  if (!sure) return;
  let done = 0;
  for (const entry of names) {
    if (await removeOne(entry.name)) done++;
  }
  toast("已删除 " + done + " 项" + (done < names.length ? "，其余失败" : ""), done < names.length ? "bad" : "good");
  exitSelect();
  loadFiles();
}

/* A browser will not open ten downloads at once, so they are handed over one at a time, slowly enough
   that the one before has been answered for. */
function downloadPicked() {
  const names = state.shown.filter((e) => state.picked.has(e.name) && !e.dir).map((e) => e.name);
  if (!names.length) { toast("选中的都是文件夹", "bad"); return; }
  toast("开始下载 " + names.length + " 个文件，浏览器可能会询问是否允许");
  names.forEach((name, index) => setTimeout(() => download(name), index * 400));
}

/* ---------------------------------------------------------------------------
   The three shapes of question this page ever asks. Each one is a sheet that already exists in the
   markup and is filled in here, and each answers with a promise, so that the code asking reads the
   way the question does: `if (await confirmSheet(...))`.

   `returnValue` is cleared before every `showModal`, or Esc would answer with the last answer.
   --------------------------------------------------------------------------- */
function askText(options) {
  const dialog = $("dlgPrompt");
  const input = $("pInput");
  const eye = $("pEye");

  $("pTitle").textContent = options.title || "输入";
  $("pNote").textContent = options.note || "";
  $("pNote").hidden = !options.note;
  $("pOk").textContent = options.ok || "确定";

  input.type = options.secret ? "password" : "text";
  input.value = options.value || "";
  input.placeholder = options.placeholder || "";

  eye.hidden = !options.secret;
  eye.innerHTML = '<svg class="ic sm"><use href="#i-eye"/></svg>';
  eye.onclick = () => {
    const shown = input.type === "text";
    input.type = shown ? "password" : "text";
    eye.innerHTML = '<svg class="ic sm"><use href="#' + (shown ? "i-eye" : "i-eye-off") + '"/></svg>';
  };

  $("pCancel").onclick = () => { dialog.returnValue = "cancel"; dialog.close(); };
  dialog.returnValue = "";
  dialog.showModal();
  setTimeout(() => { input.focus(); input.select(); }, 80);

  return new Promise((resolve) => {
    dialog.onclose = () => resolve(dialog.returnValue === "ok" ? input.value.trim() : null);
  });
}

function confirmSheet(options) {
  const dialog = $("dlgConfirm");
  const ok = $("cOk");

  $("cTitle").textContent = options.title || "确认";
  $("cNote").innerHTML = esc(options.note || "") + (options.hint ? "<br>" + esc(options.hint) : "");
  $("cNote").hidden = !options.note && !options.hint;
  ok.textContent = options.ok || "好";
  ok.className = "btn wide " + (options.danger ? "danger" : "primary");

  const remember = $("cRemember");
  remember.hidden = !options.remember;
  $("cRememberText").textContent = options.remember || "";
  let switched = false;
  $("cSwitch").onclick = () => {
    switched = !switched;
    $("cSwitch").classList.toggle("on", switched);
  };
  $("cSwitch").classList.remove("on");

  $("cCancel").onclick = () => { dialog.returnValue = "cancel"; dialog.close(); };
  dialog.returnValue = "";
  dialog.showModal();

  return new Promise((resolve) => {
    dialog.onclose = () => resolve(dialog.returnValue === "ok" ? { remember: switched } : null);
  });
}

/* Resolves to `{ value, remember }`, or null when the sheet was dismissed. Every caller takes `.value`
   and only the ones that offered the switch look at `.remember`. */
function actionSheet(options) {
  const dialog = $("dlgActions");
  const items = options.items || [];

  $("aTitle").textContent = options.title || "选择操作";
  $("aNote").textContent = options.note || "";
  $("aNote").hidden = !options.note;

  $("aList").innerHTML = items.map((item, index) =>
    '<button class="act ' + (item.danger ? "danger" : "") + '" data-v="' + index + '">' +
    '<svg class="ic sm"><use href="#' + (item.icon || "i-info") + '"/></svg>' +
    "<span>" + esc(item.label) +
    (item.desc ? '<span class="act-desc">' + esc(item.desc) + "</span>" : "") +
    "</span></button>").join("");

  const remember = $("aRemember");
  remember.hidden = !options.remember;
  $("aRememberText").textContent = options.remember || "";
  let switched = false;
  $("aSwitch").onclick = () => {
    switched = !switched;
    $("aSwitch").classList.toggle("on", switched);
  };
  $("aSwitch").classList.remove("on");

  $("aCancel").onclick = () => { dialog.returnValue = "cancel"; dialog.close(); };
  $("aList").onclick = (event) => {
    const button = event.target.closest("[data-v]");
    if (!button) return;
    dialog.returnValue = items[Number(button.dataset.v)].value;
    dialog.close();
  };

  dialog.returnValue = "";
  dialog.showModal();

  return new Promise((resolve) => {
    dialog.onclose = () => {
      const chosen = items.find((item) => item.value === dialog.returnValue);
      resolve(chosen ? { value: chosen.value, remember: switched } : null);
    };
  });
}

/* ---------------------------------------------------------------------------
   Preview. The box hands out the bytes with a type that says what they are (`inline=1`), and the
   browser is better at drawing a picture, a recording or a PDF than this file could ever be, so for
   those the work is to point an element at the URL and get out of the way.

   Text is the one worth reading in pieces: a log can be megabytes, and megabytes of text held in a
   phone to be scrolled past once is a waste of the phone. So the first part of it is read and the
   rest of the response is dropped — with a line saying so, because a preview that quietly stops is a
   preview that lies.
   --------------------------------------------------------------------------- */
let previewTarget = null;

async function readFirst(url, cap) {
  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) throw new Error(ERRORS.not_found);
  if (!response.body || !response.body.getReader) {
    const whole = new Uint8Array(await response.arrayBuffer());
    return { bytes: whole.subarray(0, cap), truncated: whole.length > cap };
  }

  const reader = response.body.getReader();
  const parts = [];
  let size = 0, truncated = false;
  for (;;) {
    const step = await reader.read();
    if (step.done) break;
    if (size + step.value.length >= cap) {
      parts.push(step.value.subarray(0, cap - size));
      size = cap;
      truncated = true;
      reader.cancel().catch(() => { /* the box will notice the hang-up and stop sending */ });
      break;
    }
    parts.push(step.value);
    size += step.value.length;
  }

  const bytes = new Uint8Array(size);
  let at = 0;
  for (const part of parts) { bytes.set(part, at); at += part.length; }
  return { bytes: bytes, truncated: truncated };
}

function decode(bytes) {
  const text = new TextDecoder("utf-8", { fatal: false }).decode(bytes);
  const broken = (text.match(/\uFFFD/g) || []).length;
  return {
    text: text,
    binary: text.indexOf("\u0000") >= 0 || broken > Math.max(2, text.length * 0.03)
  };
}

function showVoid(message) {
  const body = $("pvBody");
  body.className = "pv-body";
  body.innerHTML = '<div class="pv-void"><svg class="ic"><use href="#i-alert"/></svg>' +
    "<div>" + esc(message) + "</div>" +
    '<div class="pv-note" style="margin-top:10px">下载后可以在本机打开它</div></div>';
}

function showText(bytes, truncated) {
  const body = $("pvBody");
  const text = bytes && bytes.length ? decode(bytes) : { text: "", binary: false };
  if (text.binary) { showVoid("这个文件不是文本，写在这里只会是一堆乱码"); return; }
  body.className = "pv-body pre";
  const longLines = text.text.split("\n").some((line) => line.length > 120);
  body.innerHTML = '<pre class="' + (longLines ? "" : "wrap") + '">' + esc(text.text) + "</pre>" +
    (truncated ? '<div class="pv-note" style="padding:12px">文件较大，只预览了前面的一部分</div>' : "");
}

async function preview(entry) {
  const path = joinPath(state.path, entry.name);
  const url = "/api/download?" + new URLSearchParams({ path: path, inline: "1" }).toString();
  const kind = kindOf(entry.name, false);

  previewTarget = { path: path, name: entry.name, dir: false, url: url };
  $("pvName").textContent = entry.name;
  $("pvMeta").textContent = fmtSize(entry.size) + " · " + KIND_LABEL[kind];
  $("pvZoom").hidden = kind !== "image";

  const body = $("pvBody");
  body.className = "pv-body";
  body.innerHTML = skeletonHtml();

  const dialog = $("dlgPreview");
  dialog.returnValue = "";
  dialog.showModal();

  if (kind === "image") {
    body.innerHTML = '<img src="' + esc(url) + '" alt="">';
    const image = body.querySelector("img");
    image.onerror = () => showVoid("这张图打不开");
    $("pvZoom").onclick = () => image.classList.toggle("zoom");
  } else if (kind === "video") {
    body.innerHTML = '<video controls playsinline preload="metadata" src="' + esc(url) + '"></video>';
    body.querySelector("video").onerror = () => showVoid("这段视频播不了，可能是编码不受支持");
  } else if (kind === "audio") {
    body.innerHTML = '<audio controls preload="metadata" src="' + esc(url) + '"></audio>';
  } else if (kind === "pdf") {
    body.innerHTML = '<iframe src="' + esc(url) + '" title="PDF"></iframe>';
  } else if (kind === "text" || kind === "code") {
    try {
      const head = await readFirst(url, 400 * KB);
      showText(head.bytes, head.truncated);
    } catch (error) { showVoid(error.message); }
  } else {
    /* No extension said what this is, so its first few kilobytes are asked instead: text reading as
       text is the common case for the files people put on a box like this. */
    try {
      const head = await readFirst(url, 128 * KB);
      if (decode(head.bytes).binary) showVoid(KIND_LABEL[kind] + "不支持预览");
      else showText(head.bytes, head.truncated || entry.size > 128 * KB);
    } catch (error) { showVoid(error.message); }
  }
}

function closePreview() {
  previewTarget = null;
  $("pvBody").innerHTML = "";
  $("dlgPreview").close();
}

/* ---------------------------------------------------------------------------
   Uploads. One at a time, because the box is one small flash chip and four parallel bodies would only
   make each of them slower; a queue also gives the page somewhere to put "waiting for your answer"
   while a name that is taken is being asked about.

   A name that is taken is the box's 409 and the page's question. The question is asked once and can
   be answered for the rest of the batch — a folder of fifty files dropped onto fifty files with the
   same names is one decision, not fifty.
   --------------------------------------------------------------------------- */
function variantName(name, round) {
  const dot = name.lastIndexOf(".");
  const base = dot > 0 ? name.slice(0, dot) : name;
  const ext = dot > 0 ? name.slice(dot) : "";
  return base + " (" + round + ")" + ext;
}

function enqueueUploads(items) {
  if (!items.length) return;
  state.conflict = { asked: false, choice: null, counter: 0 };
  for (const item of items) {
    state.transfers.push({
      id: ++state.job,
      file: item.file,
      dir: item.dir,
      name: item.name || item.file.name,
      loaded: 0,
      total: item.file.size,
      speed: 0,
      state: "wait",
      note: "",
      cancel: null
    });
  }
  renderUploader();
  pump();
}

function putFile(job, name, overwrite) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    const query = new URLSearchParams({
      path: job.dir, name: name, overwrite: overwrite ? "1" : "0"
    }).toString();

    xhr.open("POST", "/api/upload?" + query, true);
    xhr.setRequestHeader("Content-Type", "application/octet-stream");
    job.cancel = () => xhr.abort();

    let lastAt = Date.now(), lastLoaded = 0;
    xhr.upload.onprogress = (event) => {
      if (!event.lengthComputable) return;
      job.loaded = event.loaded;
      job.total = event.total;
      const now = Date.now();
      if (now - lastAt > 400) {
        job.speed = ((event.loaded - lastLoaded) * 1000) / (now - lastAt);
        lastAt = now;
        lastLoaded = event.loaded;
        paintJob(job);
      }
    };

    xhr.onload = () => {
      job.cancel = null;
      let data = {};
      try { data = JSON.parse(xhr.responseText || "{}"); } catch (error) { /* the status says why */ }
      if (xhr.status >= 200 && xhr.status < 300 && !data.error) { resolve(data); return; }
      const failure = new Error(ERRORS[data.error] || "设备返回了 " + (data.error || xhr.status));
      failure.code = data.error || "http_" + xhr.status;
      reject(failure);
    };
    xhr.onerror = () => {
      job.cancel = null;
      const failure = new Error(ERRORS.network);
      failure.offline = true;
      reject(failure);
    };
    xhr.onabort = () => {
      job.cancel = null;
      const failure = new Error("已取消");
      failure.aborted = true;
      reject(failure);
    };

    xhr.send(job.file);
  });
}

async function runJob(job) {
  job.state = "up";
  job.loaded = 0;
  job.speed = 0;
  renderUploader();

  let name = job.name;
  let overwrite = false;

  for (let round = 0; round < 40; round++) {
    try {
      await putFile(job, name, overwrite);
      job.name = name;
      job.state = "done";
      job.loaded = job.total;
      job.speed = 0;
      return;
    } catch (error) {
      if (error.aborted) { job.state = "error"; job.note = "已取消"; return; }
      job.speed = 0;

      if (error.code !== "already_exists") { job.state = "error"; job.note = error.message; return; }
      if (overwrite) { job.state = "error"; job.note = "同名的文件夹挡在这里"; return; }

      if (!state.conflict.choice) {
        job.state = "waiting";
        renderUploader();
        const answer = await actionSheet({
          title: "已经存在同名的项",
          note: item2label(job),
          items: [
            { label: "覆盖", value: "overwrite", icon: "i-upload", danger: true,
              desc: "用上传的文件替换它" },
            { label: "两个都保留", value: "keep", icon: "i-copy",
              desc: "上传的文件会带一个 (1) 这样的编号" },
            { label: "跳过这一个", value: "skip", icon: "i-x", desc: "不动已经在那里的文件" }
          ],
          remember: "本次上传里其余同名的都这样处理"
        });
        job.state = "up";
        renderUploader();
        if (!answer) { job.state = "skip"; job.note = "已跳过"; return; }
        if (answer.remember) { state.conflict.choice = answer.value; state.conflict.counter = 0; }
        if (answer.value === "skip") { job.state = "skip"; job.note = "已跳过"; return; }
        if (answer.value === "overwrite") { overwrite = true; continue; }
      } else if (state.conflict.choice === "skip") {
        job.state = "skip";
        job.note = "已跳过";
        return;
      } else if (state.conflict.choice === "overwrite") {
        overwrite = true;
        continue;
      }

      name = variantName(job.name, ++state.conflict.counter);
    }
  }

  job.state = "error";
  job.note = "同名文件太多，换个名字吧";
}

function item2label(job) {
  return (job.dir === state.path ? "" : job.dir + " 里") + job.name;
}

async function pump() {
  if (pump.busy) return;
  pump.busy = true;
  for (;;) {
    const next = state.transfers.find((job) => job.state === "wait");
    if (!next) break;
    await runJob(next);
    renderUploader();
    paintJob(next);
  }
  pump.busy = false;
  renderUploader();

  const done = state.transfers.filter((job) => job.state === "done").length;
  const skipped = state.transfers.filter((job) => job.state === "skip").length;
  const failed = state.transfers.filter((job) => job.state === "error" && job.note !== "已取消").length;
  if (done || skipped || failed) {
    toast("上传结束：成功 " + done + (skipped ? "，跳过 " + skipped : "") + (failed ? "，失败 " + failed : ""),
          failed ? "bad" : "good");
  }
  loadFiles();
}

function jobHtml(job) {
  const percent = job.total ? Math.min(100, (job.loaded / job.total) * 100) : 0;
  const meta = job.state === "done" ? fmtSize(job.total) + " · 已完成"
    : job.state === "error" || job.state === "skip" ? job.note
    : job.state === "waiting" ? "等待你的选择…"
    : fmtSize(job.loaded) + " / " + fmtSize(job.total) + (job.speed ? " · " + fmtSpeed(job.speed) : "");

  const tail = job.state === "up"
    ? '<button class="up-x" data-cancel="' + job.id + '" aria-label="取消"><svg class="ic sm"><use href="#i-x"/></svg></button>'
    : job.state === "done" ? '<span class="up-x" style="color:var(--green)"><svg class="ic sm"><use href="#i-check"/></svg></span>'
    : job.state === "error" ? '<span class="up-x" style="color:var(--red)"><svg class="ic sm"><use href="#i-alert"/></svg></span>'
    : job.state === "skip" ? '<span class="up-x"><svg class="ic sm"><use href="#i-x"/></svg></span>' : "";

  return '<div class="up-item ' + job.state + '" id="job-' + job.id + '">' +
    '<div class="up-info"><div class="up-name">' + esc(job.name) + "</div>" +
    '<div class="up-meta">' + esc(meta) + "</div>" +
    '<div class="up-bar"><i style="width:' + percent.toFixed(1) + '%"></i></div></div>' + tail + "</div>";
}

function paintJob(job) {
  const node = $("job-" + job.id);
  if (!node) { renderUploader(); return; }
  const percent = job.total ? Math.min(100, (job.loaded / job.total) * 100) : 0;
  node.querySelector(".up-bar i").style.width = percent.toFixed(1) + "%";
  if (job.state === "up") {
    node.querySelector(".up-meta").textContent =
      fmtSize(job.loaded) + " / " + fmtSize(job.total) + (job.speed ? " · " + fmtSpeed(job.speed) : "");
  }
}

function renderUploader() {
  const jobs = state.transfers;
  const box = $("uploader");
  if (!jobs.length) { box.hidden = true; return; }
  box.hidden = false;

  const finished = jobs.filter((job) => job.state !== "up" && job.state !== "wait" && job.state !== "waiting");
  const done = jobs.filter((job) => job.state === "done").length;
  const skipped = jobs.filter((job) => job.state === "skip").length;
  const failed = jobs.filter((job) => job.state === "error" && job.note !== "已取消").length;

  $("upTitle").textContent = finished.length < jobs.length
    ? "正在上传 " + (finished.length + 1) + " / " + jobs.length
    : "上传结束 · 成功 " + done + (skipped ? " · 跳过 " + skipped : "") + (failed ? " · 失败 " + failed : "");
  $("upList").innerHTML = jobs.map(jobHtml).join("");
  $("upFoot").hidden = finished.length < jobs.length;
  $("upRetry").hidden = !failed;
}

/* --- getting files in: the pickers, and the drop ----------------------------------------------- */
function pickedFolder(file, base) {
  const relative = file.webkitRelativePath || "";
  const parts = relative.split("/");
  parts.pop();
  const directory = [base].concat(parts).join("/").replace(/\/+/g, "/");
  return { file: file, dir: directory || state.path, name: file.name };
}

/* A folder dropped on the page is walked, not flattened: what is being copied is a folder, and the
   box makes the folders it needs on the way in. */
async function droppedItems(dataTransfer) {
  const roots = [];
  if (dataTransfer.items && dataTransfer.items.length && dataTransfer.items[0].webkitGetAsEntry) {
    for (const item of dataTransfer.items) {
      const entry = item.webkitGetAsEntry();
      if (entry) roots.push(entry);
    }
  }
  if (!roots.length) {
    return Array.from(dataTransfer.files).map((file) => ({ file: file, dir: state.path, name: file.name }));
  }

  const out = [];
  const walk = async (entry, dir) => {
    if (entry.isFile) {
      const file = await new Promise((resolve, reject) => entry.file(resolve, reject));
      out.push({ file: file, dir: dir, name: file.name });
      return;
    }
    if (!entry.isDirectory) return;
    const reader = entry.createReader();
    const inner = joinPath(dir, entry.name);
    for (;;) {
      const batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
      if (!batch.length) break;
      for (const child of batch) await walk(child, inner);
    }
  };

  for (const root of roots) await walk(root, state.path);
  return out;
}

function showDrop(on) {
  $("dropzone").classList.toggle("on", on);
  if (on) $("dropPath").textContent = state.path;
}

function wireDrop() {
  const carries = (event) => event.dataTransfer &&
    Array.from(event.dataTransfer.types || []).indexOf("Files") >= 0;

  window.addEventListener("dragenter", (event) => {
    if (!carries(event)) return;
    event.preventDefault();
    showDrop(true);
  });
  window.addEventListener("dragover", (event) => {
    if (!carries(event)) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = "copy";
    showDrop(true);
  });
  window.addEventListener("dragleave", (event) => {
    /* Only when the pointer has actually left the window: every child element fires one of these. */
    if (event.clientX <= 0 || event.clientY <= 0 ||
        event.clientX >= window.innerWidth || event.clientY >= window.innerHeight) showDrop(false);
  });
  window.addEventListener("drop", async (event) => {
    if (!carries(event)) return;
    event.preventDefault();
    const dropped = event.dataTransfer;
    showDrop(false);
    const items = await droppedItems(dropped);
    if (!items.length) return;
    if (state.view !== "files") setView("files");
    toast("收到 " + items.length + " 个文件");
    enqueueUploads(items);
  });
}

/* --- the wifi sheet -------------------------------------------------------- */
const WIFI_STATE_TAG = { connected: "已连接", connecting: "正在连接…", scanning: "正在扫描…", disconnected: "未连接" };

function rssiBars(rssi) {
  if (rssi >= -60) return 4;
  if (rssi >= -70) return 3;
  if (rssi >= -80) return 2;
  return 1;
}

function rssiWords(rssi) {
  if (rssi >= -55) return "极好";
  if (rssi >= -65) return "很好";
  if (rssi >= -75) return "一般";
  return "较弱";
}

function kvRow(key, value, mono) {
  return '<div class="kv"><span class="k">' + esc(key) + "</span>" +
    '<span class="v' + (mono ? " mono" : "") + '">' + esc(value) + "</span></div>";
}

function renderWifi() {
  const wifi = state.wifi;
  const box = $("wifiNow");

  if (!wifi) {
    box.innerHTML = '<div class="sk"><i></i><div style="flex:1"><b class="l1"></b><b class="l2"></b></div></div>';
  } else if (!wifi.enabled) {
    box.innerHTML = '<div class="empty" style="padding:30px 20px">' +
      '<svg class="ic"><use href="#i-wifi"/></svg>' +
      '<div class="empty-title">无线网络已关闭</div>' +
      '<div class="empty-note">在设备屏幕的「设置 - 无线网络」里打开它</div></div>';
  } else if (wifi.state !== "connected") {
    box.innerHTML =
      '<div class="row"><span class="tile t-file"><svg class="ic"><use href="#i-wifi"/></svg></span>' +
      '<div class="row-main"><div class="row-name">' + esc(WIFI_STATE_TAG[wifi.state] || "未连接") + "</div>" +
      '<div class="row-meta">' + (wifi.saved ? "记住的网络：" + esc(wifi.saved) : "还没有记住的网络") + "</div></div></div>" +
      '<div class="bar-actions" style="padding:12px 14px 14px">' +
      (wifi.state === "connecting" ? '<button class="btn" id="wifiCancel">取消连接</button>' : "") +
      '<button class="btn tinted" id="wifiScan">扫描附近的网络</button>' +
      (wifi.saved ? '<button class="btn" id="wifiForget">忘记「' + esc(wifi.saved) + "」</button>" : "") +
      "</div>";
  } else {
    const bars = rssiBars(wifi.rssi);
    box.innerHTML =
      '<div class="row"><span class="tile t-dir" style="background:linear-gradient(160deg,#5ac8fa,#0a84ff)">' +
      '<svg class="ic"><use href="#i-wifi"/></svg></span>' +
      '<div class="row-main"><div class="row-name">' + esc(wifi.ssid) + "</div>" +
      '<div class="row-meta">' + esc(wifi.ip) + " · 信号" + esc(rssiWords(wifi.rssi)) + "</div></div>" +
      '<span class="sig s' + bars + '"><i></i><i></i><i></i><i></i></span></div>' +
      kvRow("状态", WIFI_STATE_TAG[wifi.state]) +
      kvRow("信号强度", wifi.rssi + " dBm") +
      kvRow("地址", wifi.ip, true) +
      kvRow("网关", wifi.gateway || "—", true) +
      kvRow("子网掩码", wifi.netmask || "—", true) +
      kvRow("记住的网络", wifi.saved || "无") +
      '<div class="bar-actions" style="padding:12px 14px 14px">' +
      '<button class="btn tinted" id="wifiDisconnect">断开连接</button>' +
      (wifi.saved ? '<button class="btn" id="wifiForget">忘记这个网络</button>' : "") +
      "</div>";
  }

  renderScan();
}

function renderScan() {
  const box = $("wifiList");
  const scan = state.scan;
  if (!scan || scan.state === "scanning") {
    box.innerHTML = '<div style="padding:26px 20px;text-align:center">' +
      '<div class="radar"></div><div class="pv-note">正在扫描附近的网络…</div></div>';
    return;
  }
  if (scan.state === "error") {
    box.innerHTML = '<div class="empty" style="padding:30px 20px"><svg class="ic"><use href="#i-alert"/></svg>' +
      '<div class="empty-title">扫描失败</div><div class="empty-note">再试一次吧</div></div>';
    return;
  }

  const seen = new Map();
  for (const net of scan.networks || []) {
    const before = seen.get(net.ssid);
    if (!before || net.rssi > before.rssi) seen.set(net.ssid, net);
  }
  const networks = Array.from(seen.values()).sort((a, b) => b.rssi - a.rssi);
  if (!networks.length) {
    box.innerHTML = '<div class="empty" style="padding:30px 20px"><svg class="ic"><use href="#i-wifi"/></svg>' +
      '<div class="empty-title">没有发现网络</div><div class="empty-note">把设备挪近一点，或者再扫描一次</div></div>';
    return;
  }

  const here = state.wifi && state.wifi.ssid;
  box.innerHTML = networks.map((net) =>
    '<div class="row tap" data-ssid="' + esc(net.ssid) + '" data-secure="' + (net.secure ? "1" : "0") + '">' +
    '<span class="tile ' + (net.ssid === here ? "t-dir" : "t-file") + '"><svg class="ic"><use href="#' +
      (net.secure ? "i-lock" : "i-wifi") + '"/></svg></span>' +
    '<div class="row-main"><div class="row-name">' + esc(net.ssid || "隐藏的网络") + "</div>" +
    '<div class="row-meta">' + (net.ssid === here ? "当前连接 · " : "") +
      (net.secure ? "需要密码" : "开放网络") + (net.channel ? " · 信道 " + net.channel : "") + "</div></div>" +
    '<span class="sig s' + rssiBars(net.rssi) + '"><i></i><i></i><i></i><i></i></span>' +
    '<svg class="ic sm chev"><use href="#i-chev"/></svg></div>').join("");
}

async function refreshWifi(quiet) {
  try {
    state.wifi = await api("/api/wifi");
    state.wifiAt = Date.now();
  } catch (error) {
    if (!quiet) toast(error.message, "bad");
    return;
  }
  syncStatus();
  if (state.view === "wifi") renderWifi();
}

/* --- the device itself ---------------------------------------------------- */
function volumeHtml(volume) {
  const used = Math.max(0, volume.total - volume.free);
  const percent = volume.total ? Math.min(100, (used / volume.total) * 100) : 0;
  const level = percent > 92 ? "full" : percent > 75 ? "warn" : "";
  return '<div class="storage">' +
    '<div class="storage-head"><span>' + esc(baseName(volume.mount) + " · " + (volume.filesystem || "")) + "</span>" +
    "<span>" + fmtSize(volume.free) + " 可用，共 " + fmtSize(volume.total) + "</span></div>" +
    '<div class="meter lg"><i class="' + level + '" style="width:' + percent.toFixed(1) + '%"></i></div></div>';
}

function renderSystem() {
  const sys = state.system;
  if (!sys) return;

  $("hero").innerHTML =
    '<span class="tile t-dir"><svg class="ic"><use href="#i-box"/></svg></span>' +
    '<div class="row-main"><div class="hero-name">HiveBox</div>' +
    '<div class="hero-sub">固件 ' + esc(sys.version) + " · " + esc(sys.build) + "</div></div>";

  const battery = sys.battery || {};
  const rows = [
    kvRow("设备名称", sys.app || "firmware"),
    kvRow("芯片", (sys.chip || "—") + " · " + (sys.cores || 1) + " 核"),
    kvRow("ESP-IDF", sys.idf || "—"),
    kvRow("构建时间", sys.build || "—"),
    '<div class="kv"><span class="k">运行时长</span><span class="v" data-uptime>—</span></div>',
    kvRow("复位原因", RESET_REASONS[sys.reset] || sys.reset || "—"),
    kvRow("空闲内存", fmtSize(sys.heap_free) + "（历史最低 " + fmtSize(sys.heap_min) + "）"),
    sys.psram_free ? kvRow("PSRAM 空闲", fmtSize(sys.psram_free)) : ""
  ].join("");

  const percent = battery.percent == null ? -1 : battery.percent;
  const meter = percent >= 0
    ? '<div class="battery"><div class="bat-head"><span class="bat-num">' + percent + '%</span>' +
      '<span class="bat-tag' + (battery.charging ? " chg" : "") + '">' +
      (battery.charging ? "正在充电" : percent >= 100 ? "已充满" : "电池供电") + "</span></div>" +
      '<div class="meter lg"><i class="' + (percent <= 10 ? "full" : percent <= 25 ? "warn" : "") +
      '" style="width:' + percent + '%"></i></div>' +
      '<div class="row-meta" style="margin-top:8px">电池电压 ' +
      (battery.voltage_mv ? (battery.voltage_mv / 1000).toFixed(2) + " V" : "—") + "</div></div>"
    : '<div class="kv"><span class="k">电池</span><span class="v">没有读到电量</span></div>';

  $("sysInfo").innerHTML = rows + meter +
    '<div class="kv"><span class="k">页面地址</span><span class="v mono">' +
    esc("http://" + location.host + "/") + "</span></div>" +
    '<div class="bar-actions" style="padding:12px 14px 14px">' +
    '<button class="btn sm tinted" id="copyUrl"><svg class="ic sm"><use href="#i-copy"/></svg>复制这个地址</button></div>';

  $("sysStorage").innerHTML = (sys.volumes || []).map(volumeHtml).join("");
  tickUptime();
}

function tickUptime() {
  const node = document.querySelector("[data-uptime]");
  if (node && state.booted) node.textContent = fmtUptime((Date.now() - state.booted) / 1000);
}

async function refreshSystem(quiet) {
  try {
    const sys = await api("/api/system");
    state.system = sys;
    state.volumes = sys.volumes || [];
    state.booted = Date.now() - (sys.uptime || 0) * 1000;
  } catch (error) {
    if (!quiet) toast(error.message, "bad");
    return;
  }
  renderVolumes();
  if (state.view === "system") renderSystem();
}

function syncStatus() {
  const dot = $("statDot"), text = $("statText"), wifi = state.wifi;
  if (!wifi) { dot.className = "dot"; text.textContent = "正在读取设备状态…"; return; }
  if (!wifi.enabled) { dot.className = "dot off"; text.textContent = "无线网络已关闭"; return; }
  if (wifi.state === "connected") { dot.className = "dot on"; text.textContent = wifi.ssid + " · " + wifi.ip; return; }
  dot.className = "dot off";
  text.textContent = (WIFI_STATE_TAG[wifi.state] || "未连接") + " · " + (location.hostname || "本机");
}

async function copyText(text) {
  try {
    if (!navigator.clipboard || !window.isSecureContext) throw new Error("no clipboard here");
    await navigator.clipboard.writeText(text);
    toast("已复制到剪贴板", "good");
  } catch (error) {
    /* Over plain http on a LAN there is no clipboard API, and the old way still works. */
    const area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    let copied = false;
    try { copied = document.execCommand("copy"); } catch (inner) { copied = false; }
    area.remove();
    toast(copied ? "已复制到剪贴板" : "复制不了，请手动选中地址", copied ? "good" : "bad");
  }
}

/* --- the three views ------------------------------------------------------ */
function setView(view) {
  state.view = view;
  for (const name of ["files", "wifi", "system"]) $("view-" + name).hidden = name !== view;

  const buttons = Array.from($("seg").querySelectorAll("button"));
  for (const button of buttons) button.classList.toggle("on", button.dataset.view === view);

  const active = buttons.find((button) => button.dataset.view === view);
  const thumb = $("segThumb");
  thumb.style.width = active.offsetWidth + "px";
  thumb.style.transform = "translateX(" + active.offsetLeft + "px)";

  try { localStorage.setItem("hivebox.view", view); } catch (error) { /* private mode */ }
  if (view === "wifi") { renderWifi(); refreshWifi(true); }
  if (view === "system") renderSystem();
}

function paintTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $("themeIcon").setAttribute("href", theme === "dark" ? "#i-sun" : "#i-moon");
}

async function scanWifi() {
  state.scan = { state: "scanning", networks: [] };
  renderScan();
  try {
    await api("/api/wifi/scan", null, "POST");
  } catch (error) {
    state.scan = { state: "error", networks: [] };
    renderScan();
    toast(error.message, "bad");
    return;
  }
  for (let round = 0; round < 30; round++) {
    await new Promise((resolve) => setTimeout(resolve, 700));
    try { state.scan = await api("/api/wifi/scan"); } catch (error) { continue; }
    if (state.scan.state !== "scanning") break;
    if (state.view === "wifi") renderScan();
  }
  if (state.scan.state === "scanning") state.scan = { state: "error", networks: [] };
  renderScan();
  if (state.scan.state === "done") {
    const found = (state.scan.networks || []).length;
    toast(found ? "发现 " + found + " 个网络" : "没有发现网络", found ? "" : "bad");
  }
}

async function waitForWifi(ssid, seconds) {
  for (let round = 0; round < seconds * 2; round++) {
    await new Promise((resolve) => setTimeout(resolve, 500));
    try { state.wifi = await api("/api/wifi"); } catch (error) { continue; }
    syncStatus();
    if (state.view === "wifi") renderWifi();
    if (state.wifi.state === "connected" && state.wifi.ssid === ssid) return true;
    if (round > 6 && state.wifi.state === "disconnected") return false;
  }
  return false;
}

async function connectTo(ssid, secure) {
  let password = "";
  if (secure) {
    const typed = await askText({
      title: "加入「" + ssid + "」",
      note: "密码只会发到这台设备",
      placeholder: "网络密码",
      secret: true,
      ok: "下一步"
    });
    if (typed === null) return;
    password = typed;
  }
  const answer = await confirmSheet({
    title: "连接到「" + ssid + "」",
    note: secure ? "设备会切换到这个网络" : "这是一个不需要密码的网络",
    ok: "连接",
    remember: "记住它，开机自动连接"
  });
  if (!answer) return;

  try {
    await api("/api/wifi/connect", { ssid: ssid, password: password }, "POST");
  } catch (error) {
    toast(error.message, "bad");
    return;
  }
  toast("正在连接 " + ssid + "…");
  const joined = await waitForWifi(ssid, 20);
  toast(joined ? "已经连上 " + ssid : "没能连上，检查一下密码", joined ? "good" : "bad");
  if (joined && answer.remember) {
    try {
      await api("/api/wifi/remember", { ssid: ssid, password: password }, "POST");
      toast("已记住这个网络", "good");
    } catch (error) { toast(error.message, "bad"); }
  }
  refreshWifi(true);
}

async function forgetWifi() {
  const sure = await confirmSheet({
    title: "忘记这个网络",
    note: state.wifi && state.wifi.saved ? state.wifi.saved : "已保存的网络",
    hint: "设备下次开机不会再自动连接它。",
    ok: "忘记",
    danger: true
  });
  if (!sure) return;
  try {
    await api("/api/wifi/forget", null, "POST");
    toast("已忘记", "good");
  } catch (error) { toast(error.message, "bad"); }
  refreshWifi(true);
}

function sortSheet() {
  const key = state.sort.key, dir = state.sort.dir;
  const mark = (name) => key === name ? (dir > 0 ? "当前 · 正序" : "当前 · 倒序") : "";
  actionSheet({
    title: "排序方式",
    items: [
      { label: "按名称", value: "name", icon: "i-sort", desc: mark("name") },
      { label: "按大小", value: "size", icon: "i-sort", desc: mark("size") },
      { label: "按类型", value: "kind", icon: "i-sort", desc: mark("kind") },
      { label: "反转排列顺序", value: "flip", icon: "i-refresh" }
    ]
  }).then((answer) => {
    if (!answer) return;
    if (answer.value === "flip") state.sort.dir = -dir;
    else if (answer.value === key) state.sort.dir = -dir;
    else { state.sort.key = answer.value; state.sort.dir = 1; }
    renderList();
  });
}

async function reboot() {
  const sure = await confirmSheet({
    title: "重启设备",
    note: "屏幕会黑一下再亮起来",
    hint: "这台设备的网页会断开，几秒后刷新本页即可。",
    ok: "重启",
    danger: true
  });
  if (!sure) return;
  try {
    await api("/api/restart", null, "POST");
    toast("设备正在重启，稍后刷新本页");
  } catch (error) { toast(error.message, "bad"); }
}

/* --- everything that listens ---------------------------------------------- */
$("list").onclick = (event) => {
  const more = event.target.closest("[data-more]");
  if (more) { rowMenu(state.shown[Number(more.dataset.more)]); return; }
  const row = event.target.closest(".row");
  if (!row) return;
  const entry = state.shown[Number(row.dataset.i)];
  if (!entry) return;
  if (state.select) togglePick(entry);
  else if (entry.dir) go(joinPath(state.path, entry.name));
  else preview(entry);
};

$("crumbs").onclick = (event) => {
  const crumb = event.target.closest("[data-go]");
  if (crumb) go(crumb.dataset.go);
};

$("volumes").onclick = (event) => {
  const chip = event.target.closest("[data-go]");
  if (chip) go(chip.dataset.go);
};

$("seg").onclick = (event) => {
  const button = event.target.closest("button");
  if (button && button.dataset.view) setView(button.dataset.view);
};

$("search").oninput = () => { state.query = $("search").value; renderList(); };
$("refreshBtn").onclick = () => loadFiles();
$("sortBtn").onclick = sortSheet;
$("mkdirBtn").onclick = makeFolder;
$("selectBtn").onclick = () => { if (state.select) exitSelect(); else enterSelect(); };
$("selAll").onclick = () => {
  const all = state.shown.every((entry) => state.picked.has(entry.name));
  state.picked.clear();
  if (!all) state.shown.forEach((entry) => state.picked.add(entry.name));
  renderList();
  syncSelectionBar();
};
$("selDone").onclick = exitSelect;
$("selDelete").onclick = deletePicked;
$("selDownload").onclick = downloadPicked;

$("upBtn").onclick = () => $("fileInput").click();
$("upDirBtn").onclick = () => $("dirInput").click();
$("fileInput").onchange = (event) => {
  const files = Array.from(event.target.files);
  event.target.value = "";
  if (files.length) enqueueUploads(files.map((file) => ({ file: file, dir: state.path, name: file.name })));
};
$("dirInput").onchange = (event) => {
  const files = Array.from(event.target.files);
  event.target.value = "";
  if (files.length) enqueueUploads(files.map((file) => pickedFolder(file, state.path)));
};
$("upHide").onclick = () => {
  state.transfers = [];
  renderUploader();
};
$("upDone").onclick = () => {
  state.transfers = [];
  renderUploader();
};
$("upRetry").onclick = () => {
  let again = false;
  for (const job of state.transfers) {
    if (job.state === "error" && job.note !== "已取消") { job.state = "wait"; job.note = ""; job.loaded = 0; again = true; }
  }
  if (again) { renderUploader(); pump(); }
};
$("upList").onclick = (event) => {
  const cancel = event.target.closest("[data-cancel]");
  if (!cancel) return;
  const job = state.transfers.find((item) => item.id === Number(cancel.dataset.cancel));
  if (job && job.cancel) job.cancel();
};

$("pvClose").onclick = closePreview;
$("pvBack").onclick = closePreview;
$("pvDownload").onclick = () => { if (previewTarget) download(previewTarget.name); };
$("pvRename").onclick = () => { if (previewTarget) { const name = previewTarget.name; closePreview(); renameOne(name); } };
$("pvDelete").onclick = () => { if (previewTarget) { const name = previewTarget.name; closePreview(); deleteOne(name, false); } };

$("wifiNow").onclick = (event) => {
  if (event.target.closest("#wifiScan")) scanWifi();
  else if (event.target.closest("#wifiForget")) forgetWifi();
  else if (event.target.closest("#wifiCancel")) {
    api("/api/wifi/disconnect", null, "POST").then(() => refreshWifi(true)).catch((error) => toast(error.message, "bad"));
  } else if (event.target.closest("#wifiDisconnect")) {
    api("/api/wifi/disconnect", null, "POST").then(() => { toast("已断开", "good"); refreshWifi(true); })
      .catch((error) => toast(error.message, "bad"));
  }
};
$("wifiList").onclick = (event) => {
  const row = event.target.closest("[data-ssid]");
  if (!row) return;
  const ssid = row.dataset.ssid;
  if (ssid === (state.wifi && state.wifi.ssid) && state.wifi.state === "connected") { toast("已经连上这个网络了"); return; }
  connectTo(ssid, row.dataset.secure === "1");
};
$("scanBtn").onclick = scanWifi;

$("sysInfo").onclick = (event) => {
  if (event.target.closest("#copyUrl")) copyText("http://" + location.host + "/");
};
$("sysRefresh").onclick = () => refreshSystem(false);
$("rebootBtn").onclick = reboot;

$("themeBtn").onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  paintTheme(next);
  try { localStorage.setItem("hivebox.theme", next); } catch (error) { /* private mode */ }
};

for (const dialog of document.querySelectorAll("dialog")) {
  dialog.addEventListener("click", (event) => {
    /* The backdrop is the dialog itself: anything inside it is a child element. */
    if (event.target !== dialog) return;
    dialog.returnValue = "cancel";
    dialog.close();
  });
}

window.addEventListener("resize", () => {
  const active = Array.from($("seg").querySelectorAll("button")).find((button) => button.classList.contains("on"));
  if (active) {
    $("segThumb").style.width = active.offsetWidth + "px";
    $("segThumb").style.transform = "translateX(" + active.offsetLeft + "px)";
  }
});

/* A page that is halfway through an upload is a page that should not be closed by a stray tap. */
window.addEventListener("beforeunload", (event) => {
  const busy = state.transfers.some((job) => job.state === "up" || job.state === "wait" || job.state === "waiting");
  if (!busy) return;
  event.preventDefault();
  event.returnValue = "";
});

function tick() {
  if (document.hidden) return;
  if (state.view === "wifi") refreshWifi(true);
  else if (state.view === "system") refreshSystem(true);
  if (!state.wifi || Date.now() - (state.wifiAt || 0) > 30000) refreshWifi(true);
}

function start() {
  paintTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light");
  wireDrop();

  let view = "files";
  try { view = localStorage.getItem("hivebox.view") || "files"; } catch (error) { /* private mode */ }
  if (["files", "wifi", "system"].indexOf(view) < 0) view = "files";
  setView(view);

  refreshSystem(true);
  refreshWifi(true);
  loadFiles();

  setInterval(tick, 5000);
  setInterval(tickUptime, 1000);
}

start();







</script>
</body>
</html>
