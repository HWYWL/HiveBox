# 推一个 `v*` 的 tag，就出一版固件：编译 → 生成合并镜像 → 挂到 Releases。
#
# 也可以手动触发（Actions → 固件发布 → Run workflow）：只产出构建产物，不发布
# —— 手动跑没有 tag，就没有版本号可核对，也没有 Release 可挂。
#
# 工具链版本是钉住的，不跟着「最新」走：`components/rust_main/CMakeLists.txt` 里写的是
# `cargo +esp198`，所以这里用 espup 装一个同样叫 `esp198` 的工具链（1.98.1.0，与本机一致）。
# 那个 CMake 注释里记着为什么不能用更旧的 `esp`（1.97 的 Xtensa LLVM 编不了 iced_core）。
name: 固件发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 建 Release 与上传资产要写权限；其余按最小权限来。
permissions:
  contents: write

# 同一个 tag 上只跑一个。不取消正在跑的那个：取消会把一个半成品 Release 留在页面上。
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

env:
  IDF_VERSION: v6.1
  # 与本机 `espup install --name esp198 --toolchain-version …` 装出来的一致。
  XTENSA_TOOLCHAIN: esp198
  XTENSA_TOOLCHAIN_VERSION: 1.98.1.0
  # 构建失败时贴几行日志尾部（贴成注解，可以从 check-run 注解接口读到）。
  BUILD_LOG_TAIL: 40

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 取代码
        uses: actions/checkout@v4
        with:
          # 版本号来自 `git describe`，浅克隆里没有 tag，就只剩一串哈希了。
          fetch-depth: 0

      # ---------------------------------------------------------------- ESP-IDF
      - name: 缓存 ESP-IDF 与其工具链
        uses: actions/cache@v4
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          # 键里不放本文件的内容哈希：改一句注释就重下一次 ESP-IDF 不划算。
          # 工具链版本变了要手动把 -v1 往上调。
          key: idf-${{ env.IDF_VERSION }}-${{ runner.os }}-v1

      - name: 安装 ESP-IDF
        run: |
          set -eo pipefail
          if [ ! -d "$HOME/esp-idf/tools" ]; then
            # 不用 --shallow-submodules：子模块被钉在各自的提交上，浅到只取分支尖端会取不到。
            git clone -b "${IDF_VERSION}" --depth 1 --recursive \
              https://github.com/espressif/esp-idf.git "$HOME/esp-idf"
          fi
          "$HOME/esp-idf/install.sh" esp32s3

      # ----------------------------------------------------------- Rust / Xtensa
      - name: 缓存 Xtensa 工具链
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/esp198
            ~/.rustup/settings.toml
            ~/export-esp.sh
          # v2：v1 里缓存的是没加 `--std` 时装的那份（多带一套 GCC）。升一版让它按现在的
          # 装法重下一次，免得哪天 PATH 顺序被改回去时那份 GCC 又冒出来顶掉 ESP-IDF 的编译器。
          key: espup-${{ env.XTENSA_TOOLCHAIN }}-${{ env.XTENSA_TOOLCHAIN_VERSION }}-${{ runner.os }}-v2

      # 注意这里没有 `| head` 这类会提前退出管道的写法：`set -o pipefail` 下，
      # 提前退出的读者会让写者吃 SIGPIPE，整步以 141 失败（第一次跑就栽在这儿）。
      #
      # 装工具链要下几百 MB，从云上跑偶尔会失败（同一个步骤第一次成功、第二次就挂过），
      # 所以这里重试三次，并且每次失败都把日志尾部贴成注解 —— 不然外面只看得见一个退出码。
      - name: 安装 Xtensa 工具链
        # espup 要查 GitHub API 才能解析发行版里的产物；匿名请求从云端 IP 出去
        # 经常撞上 60 次/小时的限流，直接 403。给它本工作流的 token 就好了。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          if ! rustup run "${XTENSA_TOOLCHAIN}" rustc --version >/dev/null 2>&1; then
            log="${RUNNER_TEMP}/espup.log"
            for attempt in 1 2 3; do
              if { command -v espup >/dev/null 2>&1 || cargo install espup --locked; } &&
                 espup install \
                   --name "${XTENSA_TOOLCHAIN}" \
                   --toolchain-version "${XTENSA_TOOLCHAIN_VERSION}" \
                   --targets esp32s3 \
                   --std \
                   --disable-timeouts > "${log}" 2>&1; then
                break
              fi
              echo "::warning::Xtensa 工具链第 ${attempt} 次安装失败"
              tail -n "${BUILD_LOG_TAIL}" "${log}" | while IFS= read -r line; do
                echo "::error::espup: ${line}"
              done
              sleep 15
            done
          fi
          rustup run "${XTENSA_TOOLCHAIN}" rustc --version

      # ------------------------------------------------------------------ 构建
      - name: 编译固件并生成合并镜像
        run: |
          set -eo pipefail
          # 先 espup 再 ESP-IDF：两个脚本都往 PATH 前面插东西，后插的排在前面，
          # 于是 C 编译器是 ESP-IDF 那套。反过来的话，espup 自带的 GCC 会盖住它，
          # 而 ESP-IDF 会拿 `idf_tools.py check-tool-supported` 一比就拒绝开工。
          . "$HOME/export-esp.sh"
          . "$HOME/esp-idf/export.sh"

          # 先单独探一下工具链：它不可用时，问题在这一行，而不在固件里。
          if ! cargo +${XTENSA_TOOLCHAIN} --version; then
            echo "::error::cargo +${XTENSA_TOOLCHAIN} 不可用 —— rustup 没认出这个工具链"
            exit 1
          fi

          cd pomelo-firmware/firmware

          # 日志要写进文件再挑着贴出来：构建日志动辄上万行，而这里失败时唯一能
          # 从外面读到的东西是 check-run 注解（下载完整日志要仓库管理员权限）。
          #
          # 先 grep 再贴：stdout 是块缓冲、stderr 不是，日志最后几行往往只是
          # Kconfig 的 NOTE（上一次就是这么被骗过去的），错误通常在更前面。
          log="${RUNNER_TEMP}/build.log"
          set +e
          idf.py build merge-bin > "${log}" 2>&1
          status=$?
          set -e

          if [ "${status}" -ne 0 ]; then
            echo "::error::idf.py 退出码 ${status}"
            echo "::error::---- 日志里最早的可疑行 ----"
            grep -n -i -E 'error|fatal|failed|cannot find|undefined reference|no such file|panic' "${log}" \
              | sed -n '1,12p' | while IFS= read -r line; do
                echo "::error::${line}"
              done
            echo "::error::---- 日志里最后的可疑行 ----"
            grep -n -i -E 'error|fatal|failed|cannot find|undefined reference|no such file|panic' "${log}" \
              | tail -n 20 | while IFS= read -r line; do
                echo "::error::${line}"
              done
            echo "::error::---- 日志末尾 15 行 ----"
            tail -n 15 "${log}" | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

          grep -E '^firmware(\.bin)? binary size|Successfully created' "${log}" || true
          ls -l build/firmware.bin build/merged-binary.bin

      - name: 核对镜像自报的版本与 tag 一致
        run: |
          set -eo pipefail
          . "$HOME/esp-idf/export.sh"
          cd pomelo-firmware/firmware
          # awk 而不是 `grep -m1` / `head -1`：那两种会提前关掉管道，让 esptool 吃 SIGPIPE。
          reported=$(python -m esptool --chip esp32s3 image-info build/firmware.bin 2>/dev/null \
                     | awk -F': ' '/^App version:/ { version = $2 } END { print version }')
          echo "镜像自报的版本：${reported}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${reported}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::镜像自报的版本（${reported}）与 tag（${GITHUB_REF_NAME}）不一致 —— 检查是否在要发布的那个提交上打了 tag"
            exit 1
          fi

      # ------------------------------------------------------------------- bin/
      #
      # 更新页要的东西（固件、字库）与它们的清单，一次归置好。文件名里的版本号和镜像自报
      # 的那个必须是同一个，否则机器会把自己认成另一个版本，更新页要么反复提示、要么永不提示
      # —— 所以版本由 `publish_bin.py` 自己问镜像（`esptool image-info`），而不是从 tag 拼。
      #
      # 固件是**两份**，而清单指的是 OTA 那份：`hivebox-firmware-*.bin` 是合并镜像（USB 刷
      # 0x0 用，README 3.1 那条命令，也是下面 ASSET/ARTIFACT 挑出来的那一份），
      # `hivebox-ota-*.bin` 是应用镜像 —— 在线更新把一个应用写进一个槽，`esp_ota_begin` 要的
      # 就是这个。塞合并镜像进去会被 `esp_ota_end` 拒收，而那个槽这时已经被写过了。
      #
      # `ls bin/hivebox-firmware-*.bin` 必须只挑出一个文件，所以新名字不能也落在那个通配里。
      #
      # 字库给的是卡上那一对（烘焙脚本直接产出的 `dist/card/`）：表当 `font` 的 `file`、字体当
      # 它的 `face`，发布脚本把两件**平铺**进 `bin/` 并记进同一个 `font` 项 —— 更新页按
      # `face` → `file` 的顺序把两件都下到 `/sdcard/fonts`，而它把一个名字既当下载地址又当落盘
      # 路径，所以清单里的名字不能带目录。
      #
      # 单独那张烘自镜像内置字体的表（`fonts/dist/*@24px.bin`）不再发：它和镜像里带着的那张
      # 一个字节都不差，发布它只会让更新页那一行对着一个「装完什么也没变」的版本喊更新。
      - name: 归置 bin/（固件、字库包与 manifest.json）
        run: |
          set -eo pipefail
          . "$HOME/esp-idf/export.sh"

          card="ui-framework/pomelo-font/dist/card"
          # `--apps`：清单里的第三个数组。不给它，发布出来的清单就只有固件和字库，商店的
          # 「可安装」一栏对着一份没有 apps 的清单，于是一台刚刷完的盒子什么也装不上 ——
          # 而应用现在是装上去的，不是编译进去的。片段是 `tools/build_apps.py` 写的那份
          # `bin/apps.json`，包本身也在 `bin/apps/` 里等着被平铺进去。
          python tools/publish_bin.py --card-dir "${card}" --apps bin/apps.json

          ls -l bin/
          firmware="$(ls bin/hivebox-firmware-*.bin)"
          echo "ASSET=${firmware}" >> "$GITHUB_ENV"
          echo "ARTIFACT=$(basename "${firmware}")" >> "$GITHUB_ENV"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          # 整个 bin/：固件、字库和 manifest.json 是一套，分开放就没有意义了。
          path: bin/

      # -------------------------------------------------------------- 发行说明
      - name: 找这一版的发行说明
        id: notes
        run: |
          set -eo pipefail
          file="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then
            echo "找到 ${file}"
            echo "path=${file}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::${file} 不存在，这一版用自动生成的发行说明"
          fi

      - name: 发布 Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # 固件、字库和清单一起发：更新页读的是仓库里的 `bin/manifest.json`，而 Release 是
          # 同一套东西的另一个入口，两边对不上的时候最难查。
          #
          # 字库里那一对（字体与烘它出来的表）挂在同一页上，正是更新页会下到卡上的那两个文件：
          # 两条路都通 —— 让板子自己下，或者从这儿下到电脑、拷进 SD 卡。
          #
          # 固件同样是两份，也一起挂：`hivebox-firmware-*` 给人用 USB 刷（README 3.1），
          # `hivebox-ota-*` 给板子在更新页里自己下 —— 少挂哪一份都有人拿不到他要的东西，而
          # 拿错那一份的后果是把应用镜像往 `0x0` 刷，板子起不来。
          files: |
            bin/hivebox-firmware-*.bin
            bin/hivebox-ota-*.bin
            bin/hivebox-font-*.bin
            bin/hivebox-face-*.otf
            bin/manifest.json
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
